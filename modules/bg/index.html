function switchWorkspaceMode(work){

 const before=document.querySelector('.dim01-frame')?.contentWindow;

 const positions=before?selectors.map(selector=>{
  const element=before.document.querySelector(selector);
  return element?[element.scrollLeft,element.scrollTop]:null;
 }):[];
 const sameView=ui.dimView==='content';
 if(!work)flushDim01Workspace();
 ui.dim01WorkMode=work;ui.dimNavOpen=false;ui.drawer=null;

  if(!frame.isConnected)return;
  const child=frame.contentWindow;
  child.scrollTo({left:scroll[0],top:scroll[1],behavior:'instant'});
  selectors.forEach((selector,i)=>{
   if(positions[i])child.document.querySelector(selector)?.scrollTo(...positions[i]);
  });
 },100),{once:true});
}

      ${task?`<div class="md-box">${esc(task.text)}</div><div class="actions" style="margin-top:15px">${topAction('查看/复制任务MD','copy-task')}${topAction('下载任务MD','download-task')}${!historical&&!c.locked?topAction('重新规划任务','regen-task'):''}${go(2,'查看 02 · 打开GPT →')}</div>`:`<div class="blank" style="padding:24px"><p>尚无正式研究任务包。先准备第一轮指令，由真实 WorkBuddy 生成候选 MD，通过文件及双 Skill 证据核验后发布。</p>${!historical&&ui.dimId==='DIM-01'&&!round1Run?topAction('准备第一轮研究任务','generate-task','primary'):''}${ui.dimId!=='DIM-01'?'<div class="notice warn" style="margin-top:12px">当前只有 DIM-01 的样例专业 Skill。其它维度尚不能生成正式任务包。</div>':''}</div>`}
    </section>`;
  }else if(step===2){
    panel=`<section class="rowpanel" id="research-step-panel" aria-label="02 打开GPT">
      <div class="flex between"><div><h3 class="mini-section">02 · 打开GPT</h3><div class="tiny">由用户自行提交任务MD，工作台只提供打开入口</div></div>${badge(c.locked?'已登记打开GPT入口':task?'等待用户打开GPT':'等待研究任务包',c.locked?'blue':'')}</div>
      <div class="line"></div>
      ${task?`<div class="notice">当前任务包：V${task.version}。请先复制或下载任务MD，再到GPT自行安排研究；平台不会向 GPT 发送内容，也不监控执行。</div><div class="actions" style="margin-top:16px">${topAction('复制任务MD','copy-task')}${topAction('下载任务MD','download-task')}${!historical&&!c.locked?topAction('启动GPT研究 ↗','launch-gpt','primary'):''}${c.locked?go(3,'查看 03 · 接收初研MD →'):''}</div>${c.locked?'<p class="tiny" style="margin-top:14px">已登记打开入口，当前任务包规划已锁定；不代表研究任务已发送或完成。</p>':''}`:`<div class="blank" style="padding:24px"><p>请先在 01 规划任务中准备研究任务包。</p>${go(1,'返回 01 · 规划任务')}</div>`}
    </section>`;
  }else if(step===3){
    panel=`<section class="rowpanel" id="research-step-panel" aria-label="03 接收初研MD">
      <div class="flex between"><div><h3 class="mini-section">03 · GPT初研MD接收</h3><div class="tiny">只接收用户交回的MD，不监控GPT执行</div></div>${badge(conf.length+' 份已确认',conf.length?'green':'')}</div>
      <div class="line"></div><div class="notice" style="margin-bottom:12px">文件归属按项目／维度／周期／任务包版本／批次核对。检测到文件≠已确认，初研成果不自动写入正文。</div>
      ${files.length?files.map(f=>`<div class="fileline"><div style="min-width:0"><b>${esc(f.name)}</b><div class="tiny">${f.confirmed?'批次：'+esc(f.batch||'初研01')+' · 已确认':'待确认归属'} · ${esc(f.kind||'初研')}</div></div>${badge(f.confirmed?'✓ 已确认':'待确认',f.confirmed?'green':'amber')}${!f.confirmed&&!historical?topAction('确认归属','confirm-md-'+f.id,'sm'):''}</div>`).join(''):'<div class="blank" style="padding:24px">尚未接收GPT研究MD</div>'}
      <div class="actions" style="margin-top:14px">${!historical?'<label class="btn" for="upload-md">＋ 选择研究MD<input id="upload-md" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden></label>':''}${!historical?topAction('初研成果已全部接收','complete-initial',conf.length?'primary':''):''}${run?go(4,'查看 04 · WorkBuddy整合 →'):''}</div>
      <p class="tiny" style="margin-top:8px">本地选择的 MD 会写入本机平台数据库；不会发送到 GPT。</p>
    </section>`;
  }else if(step===4){
    panel=`<section class="rowpanel" id="research-step-panel" aria-label="04 WorkBuddy整合">
      <div class="flex between"><div><h3 class="mini-section">04 · WorkBuddy第二轮整合</h3><div class="tiny">第二轮需要真实 WorkBuddy 双 Skill、冻结输入与六项质量核验；目前尚未接入</div></div>${run?badge(runStatusLabel(run.status),run.status==='succeeded'?'green':run.status==='failed'?'red':'blue'):badge('等待启动')}</div>
      <div class="line"></div>
      ${run?`<div class="fileline"><div><b>${esc(run.kind)}</b><div class="tiny">运行ID：${esc(run.id)}</div></div>${badge(runStatusLabel(run.status),run.status==='succeeded'?'green':run.status==='failed'?'red':run.status==='waiting'?'amber':'blue')}</div>${run.status==='failed'&&!historical?topAction('重试WorkBuddy任务','retry-run','primary'):''}`:`<div class="blank" style="padding:24px"><p>等待用户确认初研MD全部接收后启动</p>${go(3,'查看 03 · 接收初研MD')}</div>`}
      ${latest?`<div class="notice" style="margin-top:14px">已形成整合记录 ${esc(latest.version)}。可到 05 查看质量核验示意，或到 06 查看整合MD。</div><div class="actions" style="margin-top:14px">${go(5,'查看 05 · 必要时补研 →')}${go(6,'查看 06 · 整合MD交付 →')}</div>`:''}
      <div class="line"></div><div class="flex between"><strong style="font-size:12px">迟到初研MD补入</strong>${!historical?topAction('补入并重新整合','append-late','sm'):''}</div><p class="tiny">已完成整合后仍可补入，但旧输入快照与旧核验结果必须保留。</p>
    </section>`;
  }else if(step===5){
    panel=`<section class="rowpanel" id="research-step-panel" aria-label="05 必要时补研">
      <div class="flex between"><div><h3 class="mini-section">05 · 六项质量核验与唯一补研</h3><div class="tiny">六项核验需由真实 WorkBuddy 双 Skill 输出，目前尚不可用</div></div>${badge('补研 '+(c.supplementUsed||0)+'/1',(c.supplementUsed||0)?'amber':'')}</div>
      <div class="line"></div><div class="threecol">${['覆盖完整性','证据可追溯','事实一致性','章节结构','重复与冲突','未解决问题'].map(x=>`<div class="mini-stat"><div class="tiny">${esc(x)}</div><div style="font-size:12px;margin-top:8px;color:#8b9aad">${latest?'待真实Skill核验':'等待整合'}</div></div>`).join('')}</div>
      <div class="actions" style="margin-top:16px">${!historical?topAction(c.supplementUsed?'本周期补研额度已使用':'发布唯一补研任务包','supplement'):''}${!historical&&c.supplementUsed?topAction('补研成果已全部接收','complete-supplement'):''}${latest?go(6,'查看 06 · 整合MD交付 →'):''}</div>
    </section>`;
  }else{
    panel=`<section class="rowpanel" id="research-step-panel" aria-label="06 整合MD交付">
      <div class="flex between"><div><h3 class="mini-section">06 · 整合MD交付</h3><div class="tiny">查看整合结果与历史快照，由用户决定是否导入正式正文</div></div>${badge(latest?'当前版本 '+latest.version:'待交付',latest?'blue':'')}</div>
      <div class="line"></div>
      ${latest?`<div class="notice">已形成整合记录 ${esc(latest.version)}。正式正文未改变，需由用户手动导入。</div><div class="actions" style="margin-top:14px">${topAction('查看整合MD','view-result')}${!historical?topAction('作为正文导入','import-result'):''}</div>`:'<div class="blank" style="padding:24px">暂无整合MD。完成初研接收与 WorkBuddy 整合后，可在这里查看交付结果。</div>'}
      <div class="line"></div><h3 class="mini-section">整合版本记录（快照）</h3>
      ${(c.integrations||[]).length?(c.integrations||[]).map((v,i)=>`<div class="fileline"><div><b>${esc(v.version)}</b><div class="tiny">输入 ${v.fileCount} 份MD · ${dt(v.createdAt)} · ${esc(v.kind||'初研整合')}</div></div>${badge(i===c.integrations.length-1?'当前研究整合版本':'历史保留',i===c.integrations.length-1?'blue':'')}</div>`).join(''):'<div class="tiny">暂无整合快照，历史版本会按研究运行独立保留。</div>'}
    </section>`;
  }

  return `${historical?'<div class="notice warn" style="margin-bottom:15px">正在查看历史研究周期：保留旧文件和研究记录，默认只读；切换至最新周期继续操作。</div>':''}
    <nav class="research-steps" aria-label="研究周期六步导航">${names.map((name,i)=>`<button type="button" class="step ${c.stage>=i+1?'done':''} ${step===i+1?'active':''}" data-act="research-step" data-step="${i+1}" aria-current="${step===i+1?'step':'false'}"><span class="stepno">0${i+1}</span>${name}</button>`).join('')}</nav>
    <div class="threecol" style="margin-bottom:18px"><div class="mini-stat"><div class="tiny">当前周期</div><b>第${c.ordinal}期</b></div><div class="mini-stat"><div class="tiny">正式补研额度</div><b>${c.supplementUsed||0} / 1</b></div><div class="mini-stat"><div class="tiny">已确认研究MD</div><b>${conf.length}<span class="tiny"> 份</span></b></div></div>
    <div class="research-step-content">${panel}${step===1?round1StatusPanel(c):''}</div>`;
}
function runStatusLabel(s){return({waiting:'等待资源',running:'运行中',verifying:'质量核验中',succeeded:'执行完成',failed:'执行失败',unknown:'状态待核实'})[s]||s}
function editorPage(){let saved=body(ui.projectId,ui.dimId),txt=ui.editorText;let status=ui.saveState==='saved'?'✓ 已保存':ui.saveState==='saving'?'⏳ 自动保存中':ui.saveState==='error'?'! 保存失败 · 不允许离开':'● 有未保存编辑';return `<div class="flex between" style="margin-bottom:17px;flex-wrap:wrap"><div><h3 class="mini-section" style="margin-bottom:5px">正式企划正文</h3><div class="tiny">仅正文持久化后计入完成度；WorkBuddy研究MD不会自动进入这里。</div></div><div class="actions"><span class="pill ${ui.saveState==='error'?'red':ui.saveState==='saved'?'green':'amber'}" id="save-status">${status}</span><button class="btn sm" data-act="drawer" data-drawer="history">◷ 历史版本</button><label class="btn sm" for="import-body-md">↥ 导入最终整合MD<input id="import-body-md" type="file" accept=".md,.markdown,text/plain" hidden></label></div></div>${!saved?.text&&!txt?`<div class="notice warn" style="margin-bottom:16px">当前维度尚无正式正文。可在AI研究页获得WorkBuddy最终整合MD，再由用户手动导入。也可直接编写正文。</div>`:''}<div class="editor-toolbar"><span class="tiny" style="margin-right:7px">编辑模式</span><div class="seg"><button data-act="edit-mode" data-mode="visual" class="${ui.editorMode==='visual'?'active':''}">正文编辑</button><button data-act="edit-mode" data-mode="md" class="${ui.editorMode==='md'?'active':''}">Markdown</button><button data-act="edit-mode" data-mode="preview" class="${ui.editorMode==='preview'?'active':''}">只读预览</button></div><span class="tiny" style="margin-left:auto">正文版本 ${saved?.revision??0}</span></div>${ui.editorMode==='preview'?`<div class="editor preview" style="background:#fff;min-height:400px">${formatMD(txt)||'<p class="muted">暂无正文</p>'}</div>`:`<textarea spellcheck="false" class="editor ${ui.editorMode==='md'?'code':''}" id="body-editor" aria-label="当前维度正式正文编辑器" placeholder="导入WorkBuddy最终整合MD，或在此开始编辑正文…">${esc(txt)}</textarea>`}<div class="flex between" style="margin-top:13px;flex-wrap:wrap"><span class="tiny">已保存：${dt(saved?.savedAt)} · 本次进入修改后离开维度需要确认</span><div class="actions"><button class="btn sm" data-act="save-editor">立即保存</button></div></div>`}
function formatMD(src){let lines=String(src||'').split(/\r?\n/),out=[],inList=false;const inline=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');for(let l of lines){if(/^\s*[-*] /.test(l)){if(!inList){out.push('<ul>');inList=true}out.push('<li>'+inline(l.replace(/^\s*[-*] /,''))+'</li>');continue}if(inList){out.push('</ul>');inList=false}if(!l.trim()){out.push('');continue}if(/^#{1,3} /.test(l)){let n=(l.match(/^#+/)||['#'])[0].length;out.push(`<h${n}>${inline(l.slice(n+1))}</h${n}>`)}else if(/^> /.test(l)){out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>')}else out.push('<p>'+inline(l)+'</p>')}if(inList)out.push('</ul>');return out.join('\n')}
function reportPage(){let p=P(ui.projectId);if(!p)return `<div class="panel panelpad">项目不存在或已删除。</div>`;return `<div class="page-head"><div><p class="eyebrow">正式正文</p><h1>企划报告预览</h1><p class="sub">12维度连续报告 · 仅使用当前已持久化正式正文 · 未完成维度保留空白章节</p></div><div class="actions">${topAction('← 项目概览','route-overview')}${topAction('刷新预览','refresh-report')}${topAction('↧ 导出单文件HTML','export-report','primary')}</div></div><div class="report-layout"><aside class="report-toc panel"><div class="mini-section">报告目录</div>${DIMENSIONS.map(d=>`<a class="tocitem" href="#report-${d.id}">${String(d.n).padStart(2,'0')}　${esc(d.name)}</a>`).join('')}</aside><div class="report-main panel"><div class="report-cover"><p class="eyebrow">企划报告</p><h1>${esc(p.name)}</h1><div class="muted">${esc(p.type)} · 当前已保存正文 ${count(p.id)}/12 · ${dateString()}</div></div>${DIMENSIONS.map(d=>`<section id="report-${d.id}"><p class="eyebrow">维度 ${String(d.n).padStart(2,'0')}</p><h2>${esc(d.name)}　${badge(done(p.id,d.id)?'已完成':'未完成',done(p.id,d.id)?'green':'')}</h2>${done(p.id,d.id)?`<div class="preview">${formatMD(body(p.id,d.id).text)}</div>`:'<div class="blank" style="padding:18px;text-align:left">本维度暂无已保存的正式正文。</div>'}</section>`).join('')}</div></div>`}
function settingsPage(){return `<div class="page-head"><div><p class="eyebrow">本机集成</p><h1>企划决策管理</h1><p class="sub">本地集成与决策相关设置。本机数据服务已连接；第一轮支持 DIM-01 受控目录交接。</p></div>${topAction('← 返回项目列表','route-projects')}</div><div class="panel"><div class="setting-item"><div><b>项目与正文存储</b><p class="sub" style="margin-top:7px">本机 SQLite 持久化，修订冲突会阻止覆盖。</p></div>${badge('已连接','green')}</div><div class="setting-item"><div><b>WorkBuddy 本地运行器</b><p class="sub" style="margin-top:7px">第一轮可准备指令、核验真实 MD 并发布。官方 API 发送需用户授权令牌；第二轮仍待接入。</p></div>${badge('第一轮手动交接可用','blue')}</div><div class="setting-item"><div><b>12个专业Skill + 2个公共Skill</b><p class="sub" style="margin-top:7px">研究包提供 DIM-01 专业 Skill 和规划核验 Skill 样例；实际安装与调用证据仍需 WorkBuddy 核验。</p></div>${badge('待提供','amber')}</div><div class="setting-item"><div><b>GPT外部工具</b><p class="sub" style="margin-top:7px">仅尝试打开 GPT 页面，由用户自行提交任务内容。</p></div>${badge('外部入口','blue')}</div><div class="setting-item"><div><b>MD交接</b><p class="sub" style="margin-top:7px">可手动选择 MD 文件；受控目录监听尚未接入。</p></div>${badge('手动选择','amber')}</div></div><div class="notice" style="margin-top:18px">工作台不会生成模拟 WorkBuddy 成果或将研究 MD 自动写入正式正文。</div>`}
function drawModal(){const e=document.getElementById('modal-root');if(!ui.modal){e.innerHTML='';return}let m=ui.modal,html='',btns='';const cancel='<button class="btn" data-act="close-modal">取消</button>';if(m.type==='lifecycle'){let p=P(m.pid);const action=m.op==='archive'?'归档项目':m.op==='restore'?'恢复项目':'永久删除';html=`<h2>${action}</h2><p>目标项目：<b>${esc(p?.name||'不存在')}</b><br>项目ID：${esc(m.pid)}　·　类型：${esc(p?.type||'')}</p>${m.op==='delete'?`<div class="notice warn">将永久删除本机平台中的项目、12维度正文、研究周期及历史版本。已导出的HTML和平台外文件不会自动删除。</div><div class="formfield" style="margin-top:17px"><label>输入“确认删除”继续</label><input id="delete-word" placeholder="确认删除" autocomplete="off"></div>`:`<div class="notice">归档保留正文、研究任务、原始MD和历史版本，并从在用列表隐藏；恢复使用原projectId。</div>`}`;btns=cancel+`<button class="btn ${m.op==='delete'?'danger':'primary'}" data-act="confirm-lifecycle">${action}</button>`}
else if(m.type==='leave'){html=`<h2>离开当前维度？</h2><p>你在“${esc(dim(ui.dimId).name)}”本次编辑会话中修改了正文。按既定方案C，无论是否已自动保存，离开维度前都需要确认。</p><div class="notice ${ui.saveState==='error'?'warn':''}">当前保存状态：<b>${esc(ui.saveState==='saved'?'已自动保存':ui.saveState==='saving'?'保存中':ui.saveState==='error'?'保存失败，禁止离开':'有未保存改动')}</b><br>目标位置：${esc(m.target?.label||'其他页面')}</div>`;btns=cancel+`<button class="btn primary" data-act="confirm-leave">${ui.saveState==='saved'?'确认离开':'保存并离开'}</button>`}
else if(m.type==='new-cycle'){html=`<h2>开启新研究周期</h2><p>项目：${esc(P(ui.projectId)?.name)}<br>维度：${esc(dim(ui.dimId).name)}</p><div class="notice">创建独立researchCycleId。旧周期全部研究资料保留；新周期补研额度0/1；正式正文和HTML报告均不改变。</div>`;btns=cancel+`<button class="btn primary" data-act="confirm-new-cycle">开启新周期</button>`}
else if(m.type==='regen'){html=`<h2>重新规划研究任务</h2><p>只有尚未启动GPT研究、未回交研究MD的当前周期允许重新规划。新的候选任务包通过WorkBuddy真实核验并落盘后，才能成为新的正式版本；旧版本始终保留。</p><div class="notice">WorkBuddy 未连接，此操作暂不可用。</div>`;btns=cancel+`<button class="btn primary" data-act="confirm-regen">重新规划</button>`}
else if(m.type==='launch-gpt'){html=`<h2>启动GPT研究</h2><p>工作台只负责打开GPT工具。之后由用户自行提交任务MD、安排GPT研究和管理其外部执行过程。</p><div class="notice warn">浏览器无法可靠判断跨域GPT网页是否真正完成加载、登录或已收到任务。平台会尝试打开ChatGPT，并提供“我已成功打开”兜底确认；不会自动发送任何研究数据。</div>`;btns=cancel+`<button class="btn primary" data-act="do-launch">打开GPT工具 ↗</button>`}

async function sha256Hex(buf){const dig=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(dig)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function loadTemplateBaseline(force){
  if(templateBaselineLoading)return;
  if(templateBaselineRequested&&!force)return;
  templateBaselineRequested=true;
  templateBaselineLoading=true;templateBaselineError='';
  if(!templateBaseline)render();
  try{
    let data=null;
    try{
      const res=await fetch('/dimension-assets/template-baseline.json',{cache:'no-store'});
      if(res.ok)data=await res.json();
    }catch(_){/* fall through to embed */}
    if(!data)data=typeof TEMPLATE_BASELINE_EMBED==='object'?TEMPLATE_BASELINE_EMBED:null;
    if(!data)throw Error('基线清单不可用');
    templateBaseline=data;
    await compareTemplateBaseline();
  }catch(err){
    if(!templateBaseline&&typeof TEMPLATE_BASELINE_EMBED==='object'){
      templateBaseline=TEMPLATE_BASELINE_EMBED;
      try{await compareTemplateBaseline()}catch(_){templateDiffByDim=null}
      templateBaselineError='';
    }else{
      templateBaseline=null;templateDiffByDim=null;templateBaselineError=err.message||String(err);
    }
  }finally{
    templateBaselineLoading=false;render();
  }
}
async function compareTemplateBaseline(){
  const activeId=templateBaseline?.activeBaselineId;
  const active=(templateBaseline?.versions||[]).find(v=>v.id===activeId)||(templateBaseline?.versions||[])[0];
  const dims=active?.dimensions||{};
  const out={};
  await Promise.all(Object.keys(dims).map(async id=>{
    const rec=dims[id];
    const files=rec?.files||[];
    let changed=0;
    for(const f of files){
      try{
        const r=await fetch('/dimension-assets/'+f.path,{cache:'no-store'});
        if(!r.ok){changed++;continue}
        const hex=await sha256Hex(await r.arrayBuffer());
        if(hex!==f.sha256)changed++;
      }catch{changed++}
    }
    out[id]={ok:changed===0,changed,total:files.length};
  }));
  templateDiffByDim=out;
}

function surveyCard(d){const st=dimSurvey(d.id);const status=st.status||'idle';const locked=researchBusy||status==='running'||status==='queued';let btns='';if(status==='idle')btns=`<button class="btn primary" data-act="survey-start" data-dim="${d.id}" ${researchBusy?'disabled':''}>开始研究</button>`;else if(status==='queued'||status==='running')btns=`<button class="btn" disabled>${surveyStatusLabel(status)}</button>${st.taskId?`<button class="btn" data-act="survey-view" data-dim="${d.id}">查看研究成果</button>`:''}`;else if(status==='success')btns=`<button class="btn primary" data-act="survey-view" data-dim="${d.id}">查看研究成果</button>${st.synced?'<button class="btn" disabled>已同步</button>':`<button class="btn" data-act="survey-sync" data-dim="${d.id}" ${researchBusy||!st.taskId?'disabled':''}>确认更新W</button>`}<button class="btn" data-act="survey-retry" data-dim="${d.id}" ${researchBusy?'disabled':''}>重新研究</button>`;else btns=`<button class="btn primary" data-act="survey-retry" data-dim="${d.id}" ${researchBusy?'disabled':''}>重新研究</button>${st.taskId?`<button class="btn" data-act="survey-view" data-dim="${d.id}">查看研究成果</button>`:''}`;const imported=surveyImportLabel(st);return `<article class="survey-card" aria-label="${esc(d.name)}"><div class="survey-top"><span class="survey-name">${esc(d.name)}</span><span>${badge(surveyStatusLabel(status),surveyStatusTone(status))}${imported?badge(imported,imported==='已同步'?'green':imported==='同步失败'?'red':'amber'):''}</span></div><div class="survey-round">${esc(surveyRoundLabel(st.rounds||0))}</div>${st.error?`<div class="tiny">${esc(st.error)}</div>`:''}${st.errorDetail?`<details class="tiny"><summary>查看详情</summary><div>${esc(st.errorDetail)}</div></details>`:''}${st.syncError&&!st.synced?`<div class="tiny">${esc(st.syncError)}</div>`:''}<div class="survey-btns">${btns}</div></article>`}
function surveyCapabilityNote(){const caps=researchCaps;if(!caps)return '正在确认研究是否可以开始。';if(caps.error?.message)return caps.error.message;const known={LOCAL_RESEARCH_NOT_CONFIGURED:'研究执行器尚未启用。',CODEX_RESEARCH_NOT_CONFIGURED:'Codex专业研究尚未启用。',PROFESSIONAL_SKILL_MISSING:'证书资质全的专业研究技能缺失。',NATIVE_SKILL_NOT_DISCOVERED:'Codex没有发现这项专业研究技能。',NATIVE_EXECUTION_VERIFICATION_REQUIRED:'执行器已连接，但还没有完成一次真实技能研究。'};if(caps.taskCreationEnabled){const missing=(caps.dimensions||[]).filter(d=>d.enabled===false);return missing.length?('证书资质全可以发起研究。其余 '+missing.length+' 个维度还没有可执行的专业研究技能，发起后会显示真实失败原因，不会用示例内容代替。'):''}const reasons=(caps.blockedReasons||[]).map(code=>known[code]||'调度中心暂不允许创建研究任务。');if(!reasons.length)reasons.push('调度中心暂不允许创建研究任务。');return [...new Set(reasons)].join('')}
function surveyBatchState(){const batch=projectSurvey().batch;if(!batch?.dims)return {kind:'none',pending:[]};const terminal=DIMENSIONS.every(d=>{const item=batch.dims[d.id];const st=dimSurvey(d.id);return item&&st.taskId===item.taskId&&(st.status==='success'||st.status==='failed')});if(!terminal)return {kind:'running',pending:[]};const pending=DIMENSIONS.filter(d=>{const item=batch.dims[d.id];const st=dimSurvey(d.id);return item&&st.taskId===item.taskId&&st.status==='success'&&!st.synced});return {kind:pending.length?'ready':'empty',pending}}
function surveyTaskRow(d){const st=dimSurvey(d.id);const status=st.status||'idle';const tone=status==='success'?'green':status==='failed'?'red':status==='running'||status==='queued'?'blue':'grey';const imported=surveyImportLabel(st);let files='—';if(status==='success'&&st.synced)files='已写入编辑内容';else if(status==='success')files='待确认';else if(status==='queued'||status==='running')files='待生成';else if(status==='failed')files='未形成成果';let ops='';if(status==='idle')ops=`<button class="btn primary" type="button" data-act="survey-start" data-dim="${d.id}" ${researchBusy?'disabled':''}>开始研究</button>`;else if(status==='queued'||status==='running')ops=st.taskId?`<button class="a-text" type="button" data-act="survey-view" data-dim="${d.id}">查看研究成果</button>`:`<button class="btn" type="button" disabled>${surveyStatusLabel(status)}</button>`;else if(status==='success')ops=`<button class="a-text" type="button" data-act="survey-view" data-dim="${d.id}">查看研究成果</button>${st.synced?'<button class="btn" type="button" disabled>已同步</button>':`<button class="btn" type="button" data-act="survey-sync" data-dim="${d.id}" ${researchBusy||!st.taskId?'disabled':''}>确认更新W</button>`}<button class="btn" type="button" data-act="survey-retry" data-dim="${d.id}" ${researchBusy?'disabled':''}>重新研究</button>`;else ops=`<button class="btn primary" type="button" data-act="survey-retry" data-dim="${d.id}" ${researchBusy?'disabled':''}>重新研究</button>${st.taskId?`<button class="a-text" type="button" data-act="survey-view" data-dim="${d.id}">查看研究成果</button>`:''}`;return `<tr><td><b>${esc(d.name)}</b><small>${esc(d.id)} · ${esc(surveyRoundLabel(st.rounds||0))}${imported?' · '+esc(imported):''}</small>${st.error?`<small>${esc(st.error)}</small>`:''}</td><td><span class="a-status a-status-${tone}"><i></i>${surveyStatusLabel(status)}</span></td><td>${files}</td><td><div class="a-actions">${ops}</div></td></tr>`}
function surveyBoardPanel(){const bag=projectSurvey();if(!ui.researchSupplement)ui.researchSupplement=bag.supplement||'';const filter=ui.taskFilter||'all';const rows=DIMENSIONS.filter(d=>{const s=dimSurvey(d.id);const status=s.status||'idle';if(filter==='review')return status==='success'&&!s.synced;if(filter==='working')return status==='queued'||status==='running';if(filter==='idle')return status==='idle';if(filter==='failed')return status==='failed';return true});const accept=researchAccept;const batchState=surveyBatchState();const batch=batchState.kind==='ready'?`<button class="btn" type="button" data-act="survey-sync-all" ${researchBusy?'disabled':''}>全部同步W</button>`:batchState.kind==='empty'?'<button class="btn" type="button" disabled>没有待同步的研究成果</button>':batchState.kind==='running'?'<button class="btn" type="button" disabled>本轮研究尚未全部结束</button>':'';const filters=[['all','全部任务'],['review','待确认'],['working','处理中'],['idle','未开始'],['failed','研究失败']].map(([id,label])=>`<button type="button" data-act="survey-filter" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('');const body=rows.length?rows.map(surveyTaskRow).join(''):'<tr><td colspan="4"><div class="a-empty">这个筛选下没有研究任务。</div></td></tr>';const note=surveyCapabilityNote();return `<section class="s1-research" aria-label="研究任务列表"><div class="a-list-tools"><div class="a-filter" role="group" aria-label="筛选研究任务">${filters}</div><div class="a-actions"><button class="btn primary" type="button" data-act="survey-start" data-dim="DIM-03" ${researchBusy?'disabled':''}>发起研究</button><button class="btn" type="button" data-act="survey-start-all" ${researchBusy?'disabled':''}>研究全部12维</button>${batch}<button class="btn" type="button" data-act="research-refresh" ${researchBusy?'disabled':''}>刷新状态</button></div></div>${note?`<p class="tiny" style="margin:-6px 0 12px">${esc(note)}</p>`:''}<div class="a-table-wrap"><table><thead><tr><th>研究任务</th><th>状态</th><th>成果</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div><div class="a-table-foot"><span>共 ${rows.length} 项</span><span>状态以后端返回为准</span></div>${researchBusy?'<div class="notice" style="margin-top:12px">正在等待调度中心返回，页面不会提前显示研究已开始。</div>':''}${accept?`<p class="tiny" style="margin-top:12px">最近一次请求：${esc(researchPlainResult(accept.value,accept.status))}</p>`:''}</section>`}
function surveyResultView(){const result=researchResult;if(!result)return '';const value=result.value||{};const report=value.markdown||value.md||'';const content=value.json||value.artifactJson||null;if(!report&&!content)return '';const text=typeof content==='string'?content:content?JSON.stringify(content,null,2):'';return `<div class="line"></div><h3 class="mini-section">研究报告</h3><p class="tiny">研究报告和企划内容均为只读，不能在这里修改研究结果。</p>${report?`<div class="md-box">${esc(report)}</div>`:'<div class="blank">还没有研究报告。</div>'}<h3 class="mini-section">企划内容</h3>${text?`<pre style="white-space:pre-wrap;max-height:220px;overflow:auto">${esc(text)}</pre>`:'<div class="blank">还没有可导入的企划内容。</div>'}`}
function s1ResearchPanel(cycle,overview){return surveyBoardPanel()}
async function researchRequest(method,path,body){const headers={Accept:'application/json'};const opts={method,headers,credentials:'same-origin'};if(body!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}const response=await fetch(RESEARCH_API+path,opts);const textBody=await response.text();let value=null;try{value=textBody?JSON.parse(textBody):{}}catch{value={error:{code:'INVALID_JSON',message:'响应不是 JSON'},raw:textBody.slice(0,400)}}return {ok:response.ok,status:response.status,value}}
async function loadResearchCaps(force){if(researchCapsRequested&&!force)return;researchCapsRequested=true;try{const [contract,caps]=await Promise.all([researchRequest('GET','/contract'),researchRequest('GET','/capabilities')]);researchContract=contract;researchCaps=caps.ok?caps.value:{ready:false,error:caps.value?.error||{code:'CAPABILITIES_UNAVAILABLE',message:'调度中心能力查询失败'},httpStatus:caps.status};render()}catch(error){researchCaps={ready:false,error:{code:'NETWORK',message:error.message}};render()}}
function openDim03Research(scope){ui.researchScope=scope==='all'?'all':'single';if(ui.page==='workspace'&&ui.dimId==='DIM-03'){ui.dimView='process';ui.tab='research';render();loadResearchCaps(true);return}changePage('workspace',null,'DIM-03');if(ui.page==='workspace'&&ui.dimId==='DIM-03'){ui.dimView='process';ui.tab='research';render();loadResearchCaps(true)}}
async function ensureSurveyCycle(dimId){const key=cycleKey(ui.projectId,dimId);data.cycles[key]??=[];const cs=data.cycles[key];if(!cs.length){const c={id:uid('cyc'),ordinal:1,projectId:ui.projectId,dimensionId:dimId,createdAt:now(),stage:0,taskVersions:[],files:[],integrations:[],supplementUsed:0,locked:false};cs.push(c);ui.cycleId=c.id;await persist()}return cs.at(-1)}
async function submitSurvey(dimId){ui.surveyFocusDim=dimId;const bag=projectSurvey();bag.supplement=ui.researchSupplement||'';saveSurveyStore();const c=await ensureSurveyCycle(dimId);if(!c)throw Error('当前项目还不能发起这项研究。');const skill=researchCaps?.dimensions?.find(d=>d.dimensionId===dimId)?.skillVersion??null;const body={sourceModule:'bg',projectId:ui.projectId,dimensionId:dimId,cycleId:c.id,skillVersion:skill,schemaVersion:'v5',supplement:ui.researchSupplement||'',inputRefs:[],idempotencyKey:('bg:'+dimId+':'+ui.projectId+':'+c.id+':'+Date.now()).slice(0,128)};const result=await researchRequest('POST','/tasks',body);researchAccept=result;researchResult=null;const st=dimSurvey(dimId);st.rounds=(st.rounds||0)+1;st.syncError='';if(result.value?.taskId){const raw=String(result.value.status||result.value.state||'').toLowerCase();st.status=['queued','pending','waiting','accepted'].includes(raw)?'queued':'running';st.taskId=result.value.taskId;st.error='';st.errorDetail='';researchQuery=result.value;await pollS1Research(result.value.taskId,dimId)}else{st.status='failed';st.taskId='';st.error=researchErrorText(result.value,result.status);st.errorDetail=researchErrorDetail(result.value,result.status);researchQuery=null}saveSurveyStore();return st}
async function startS1Research(scope,dimId='DIM-03'){if(researchBusy)return;const current=dimSurvey(dimId);if(current.status==='running'||current.status==='queued'){toast('这项研究尚未结束，不能重复发起。');return}ui.researchScope=scope==='all'?'all':'single';researchBusy=true;render();try{const st=await submitSurvey(dimId);toast(st.taskId?'研究请求已受理。':(st.error||'研究没有受理。'))}catch(error){researchAccept={ok:false,status:0,value:{error:{message:error.message}}};const st=dimSurvey(dimId);st.status='failed';st.rounds=(st.rounds||0)+1;st.error=error.message;st.errorDetail='';saveSurveyStore();toast(error.message)}finally{researchBusy=false;ui.surveyFocusDim='';render()}}
function surveyCanSkip(dimId){const st=dimSurvey(dimId);return Boolean(st.taskId)&&(st.status==='running'||st.status==='queued'||st.status==='success')}
async function startSurveyBatch(){if(researchBusy)return;const open=DIMENSIONS.filter(d=>{const s=dimSurvey(d.id).status;return s==='queued'||s==='running'});if(open.length){toast('还有研究尚未结束：'+open.map(d=>d.name).join('、')+'。请等本轮结束后再开始新的完整研究。');return}const bag=projectSurvey();bag.batch={id:'batch-'+Date.now(),dims:{}};saveSurveyStore();researchBusy=true;ui.researchScope='all';render();let opened=0;try{for(const d of DIMENSIONS){ui.surveyFocusDim=d.id;render();try{const st=await submitSurvey(d.id);bag.batch.dims[d.id]={taskId:st.taskId||''};if(st.taskId&&(st.status==='running'||st.status==='queued'))opened++;saveSurveyStore()}catch(error){const st=dimSurvey(d.id);st.status='failed';st.rounds=(st.rounds||0)+1;st.error=error.message;st.errorDetail='';bag.batch.dims[d.id]={taskId:st.taskId||''};saveSurveyStore()}}}finally{researchBusy=false;ui.surveyFocusDim='';render();toast(opened?('本轮已受理 '+opened+' 项。'):'本轮没有新的研究被受理。')}}
async function confirmSurveySync(dimId,jump){const st=dimSurvey(dimId);const name=dim(dimId).name;if(st.synced){toast('这项研究成果已经同步，不能再次覆盖后续修改。');return false}if(st.status!=='success'||!st.taskId){toast('这项研究还没有可同步的成果。');return false}const version=Number(st.resultVersion);if(!Number.isInteger(version)||version<1){toast('成果版本还没有从研究接口返回，不能导入。');return false}const q=new URLSearchParams({projectId:ui.projectId,dimensionId:dimId,taskId:st.taskId,resultVersion:String(version)});const preview=await researchRequest('GET','/imports/preview?'+q.toString());if(!preview.ok||!preview.value?.syncToken){st.syncError=name+'未能同步。'+researchErrorText(preview.value,preview.status);st.errorDetail=researchErrorDetail(preview.value,preview.status);saveSurveyStore();toast(st.syncError);return false}const response=await researchRequest('POST','/imports',{projectId:ui.projectId,dimensionId:dimId,taskId:st.taskId,resultVersion:version,syncToken:preview.value.syncToken,expectedRevision:preview.value.expectedRevision,editingState:'saved',overwriteWorking:!!(preview.value.backupRequired||preview.value.hasWorkingChanges)});const value=response.value||{};if(!response.ok||value.applied===false||value.accepted===false){st.syncError=name+'未能同步。'+researchErrorText(value,response.status);st.errorDetail=researchErrorDetail(value,response.status);saveSurveyStore();toast(st.syncError);return false}if(value.state&&typeof value.revision==='number'){data=value.state;serverRevision=value.revision}st.synced=true;st.syncError='';saveSurveyStore();if(jump){changePage('workspace',null,dimId);ui.dim01WorkMode=true;ui.dimView='content'}return true}
async function syncSurveyOne(dimId){if(researchBusy)return;researchBusy=true;render();try{const ok=await confirmSurveySync(dimId,true);toast(ok?'研究成果已写入编辑内容，已进入工作模式。':'未能写入，编辑内容未改变。')}finally{researchBusy=false;render()}}
async function syncSurveyAll(){if(researchBusy)return;const state=surveyBatchState();if(state.kind!=='ready'){toast(state.kind==='running'?'本轮研究尚未全部结束。':'没有待同步的研究成果');return}researchBusy=true;render();let done=0;try{for(const d of state.pending){if(await confirmSurveySync(d.id,false))done++}}finally{researchBusy=false;render();toast('已同步 '+done+' 项。失败的维度未改动编辑内容，可单独查看原因。')}}
async function pollS1Research(taskId,dimId=ui.surveyFocusDim||'DIM-03'){if(!taskId||!ui.projectId)return;const result=await researchRequest('GET','/tasks/'+encodeURIComponent(taskId)+'?projectId='+encodeURIComponent(ui.projectId));researchQuery={...result.value,taskId:result.value?.taskId||taskId};const st=dimSurvey(dimId);st.taskId=researchQuery.taskId||taskId;const raw=String(researchQuery.status||researchQuery.state||'').toLowerCase();if(['failed','error','cancelled','canceled'].includes(raw)){st.status='failed';st.error=researchErrorText(result.value,result.status);st.errorDetail=researchErrorDetail(result.value,result.status)}else if(['completed','succeeded','success','done'].includes(raw)){const got=await researchRequest('GET','/results/'+encodeURIComponent(st.taskId)+'?projectId='+encodeURIComponent(ui.projectId));const md=got.value?.markdown||got.value?.md;const jsonDoc=got.value?.json||got.value?.artifactJson;if(md&&jsonDoc){st.status='success';st.resultVersion=got.value?.resultVersion||got.value?.version||'';st.error='';st.errorDetail='';researchResult=got}else{st.status='failed';st.error='研究已结束，但还没有可导入的企划内容。';st.errorDetail=''}}else if(['queued','pending','waiting','accepted'].includes(raw)){st.status='queued';st.error='';st.errorDetail=''}else if(result.status===501){/* 查询未接通时保留上一状态 */}else if(result.ok){st.status='running';st.error='';st.errorDetail=''}saveSurveyStore();render()}
async function loadS1ResearchResult(dimId){const st=dimSurvey(dimId||'DIM-03');const taskId=st.taskId||researchQuery?.taskId||researchAccept?.value?.taskId;if(!taskId){toast('还没有可查看的研究任务。');return}const result=await researchRequest('GET','/results/'+encodeURIComponent(taskId)+'?projectId='+encodeURIComponent(ui.projectId));researchResult=result;const md=result.value?.markdown||result.value?.md;const jsonDoc=result.value?.json||result.value?.artifactJson;if(md&&jsonDoc){st.status='success';st.resultVersion=result.value?.resultVersion||result.value?.version||st.resultVersion||'';st.error=''}else if(result.ok){st.status='failed';st.error='研究已结束，但还没有可导入的企划内容。'}saveSurveyStore();render();toast(md&&jsonDoc?'已打开研究报告和企划内容。':researchErrorText(result.value,result.status))}
async function round1Post(action,payload){const response=await fetch('/api/workbuddy/round1/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-BG-Token':window.__BOOT__?.csrfToken||''},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.error||'第一轮接口失败');return result}
async function loadRound1Status(){const c=cycle();if(!c||ui.page!=='workspace'||ui.dimId!=='DIM-01'){round1Run=null;return}const currentId=c.id;try{const response=await fetch('/api/workbuddy/round1/status?projectId='+encodeURIComponent(ui.projectId)+'&dimensionId='+encodeURIComponent(ui.dimId)+'&cycleId='+encodeURIComponent(currentId));const result=await response.json();if(!response.ok)throw Error(result.error||'状态查询失败');if(cycle()?.id!==currentId)return;round1Run=result.run;round1ApiAvailable=result.api_available;render()}catch(error){toast('第一轮状态查询失败：'+error.message)}}

async function createProject(){
  if(createBusy)return;
  createBusy=true;ui.createError='';render();

    next.projects.unshift({id:projectId,name:ui.draftName,type:ui.draftType,status:'active',createdAt:now(),updatedAt:now()});

}

function workspaceValidation(did,value){
 const problems=[];
 if(did==='DIM-01'){
  if(!Array.isArray(value?.rows))return ['请先在新版内容展示中核对并编辑旧版资料'];
  const fields=value.fields||[];
  const fieldNames=fields.map(field=>field.name.trim());
  if(fields.length<1||fields.length>4||fieldNames.some(name=>!name)||new Set(fieldNames).size!==fields.length)problems.push('描述字段须为一到四项，名称非空且互不重复');
  for(const category of [...value.rows,...value.cols])if(!category.name.trim())problems.push('矩阵分类名称未填写');
  const cards=Object.values(value.cards).filter(Boolean);
  for(const card of cards){
   const title=card.title.trim()||'未命名矩阵卡片';
   if(!card.title.trim())problems.push('矩阵卡片标题未填写');
   if(!['project','covered','uncovered'].includes(card.status))problems.push(title+'：请选择覆盖状态');
   for(const field of fields)if(!card.values[field.id]?.trim())problems.push(title+'：'+field.name+'未填写');
  }
  for(const group of value.groups){
   if(!group.name.trim())problems.push('产品分类名称未填写');
   for(const product of group.products)if(!product.name.trim())problems.push((group.name||'未命名分类')+'：产品名称未填写');
  }
  if(!cards.length&&!value.groups.some(group=>group.products.length))problems.push('至少填写一张矩阵卡片或一项产品');
 }
 if(did==='DIM-03'&&value?.format==='v5'){
  const fields=[['name','资质名称'],['grade','资质等级'],['expiry','有效期'],['owned','公司是否拥有'],['difficulty','获取难度'],['barrier','行业门槛']];
  const active=(value.rows||[]).filter(row=>fields.some(([key])=>String(row[key]||'').trim()));
  if(!active.length)problems.push('至少填写一条资质记录');
  active.forEach((row,index)=>fields.forEach(([key,label])=>{const content=String(row[key]||'').trim();if(!content||key==='owned'&&!['是','否'].includes(content)||['difficulty','barrier'].includes(key)&&!['低','中','高','待核实'].includes(content))problems.push(`第 ${index+1} 条：${label}`)}));
 }
 if(did==='DIM-06'&&value?.format==='v5'){
  const keys=['category','product','function','functional','design','test','competitor','experience'];let count=0;
  (value.rows||[]).forEach((row,r)=>{
   const effective=keys.map((key,c)=>{const m=(value.merges||[]).find(x=>r>=x.r&&r<x.r+x.rs&&c>=x.c&&c<x.c+x.cs);return m?(m.c===c?value.rows[m.r]?.[key]||'':''):row[key]||''});
   if(!effective.some(text=>String(text).trim()))return;count++;
   effective.slice(0,6).forEach((text,c)=>{if(!String(text).trim())problems.push(`第 ${r+1} 行：${keys[c]} 未填写`)});
  });
  if(!count)problems.push('至少填写一条性能记录');
 }
 if(did==='DIM-04'&&value?.format==='v1.1'){
  const fields=['name','source','maturity','leading','barrier','value','company','industry'];
  const rows=(value.rows||[]).filter(row=>fields.some(key=>String(row[key]||'').trim()));
  if(!rows.length)problems.push('至少填写一项技术');
  rows.forEach((row,index)=>fields.forEach(key=>{if(key==='company'&&row.aiInitial&&!row.companyTouched)return;if(!String(row[key]||'').trim())problems.push(`第 ${index+1} 项技术：${key}`)}));
  rows.forEach(row=>{const analysis=value.analysis?.[row.id];if(!analysis){problems.push(`${row.name}：先进性分析`);return}if(!String(analysis.overall||'').trim()||!String(analysis.scope||'').trim())problems.push(`${row.name}：核心判断和成立范围`);for(const point of analysis.points||[]){if(!point.evidence?.length)problems.push(`${row.name}：${point.title||'先进点'}缺少原文依据`);for(const id of point.evidence||[]){const source=value.evidence?.[id];if(!source||!source.publisher?.trim()||!source.title?.trim()||!/^https?:\/\//.test(source.url||'')||!source.support?.trim())problems.push(`${row.name}：原文依据 ${id} 不完整`)}}});
 }
 if(did==='DIM-02'){
  const large=value?.enabled?.large!==false,scenes=value?.enabled?.scenes!==false;
  if(!large&&!scenes)problems.push('至少启用一个应用章节');
  if(scenes&&!value.scenes?.length)problems.push('至少创建一个细分业务场景');
  if(large){if(!value.largeImage)problems.push('大场景主图');if(!value.largeName?.trim())problems.push('大场景名称');if(!value.systems?.length)problems.push('至少一个业务系统');for(const sys of value.systems||[]){if(!sys.name?.trim())problems.push('业务系统名称');if(!sys.devices?.length)problems.push(`${sys.name||'未命名系统'}：至少一款设备`);for(const device of sys.devices||[])if(!device.name?.trim())problems.push('设备名称')}}
  if(scenes)for(const scene of value.scenes||[]){if(!scene.name?.trim())problems.push('业务场景名称');if(!scene.topology)problems.push(`${scene.name||'未命名场景'}：拓扑原图`);for(const field of ['features','needs','pains','goals']){if(!scene[field]?.length)problems.push(`${scene.name||'未命名场景'}：${field}`);for(const row of scene[field]||[])if(field==='goals'?!row.text?.trim():!row.name?.trim()||!row.description?.trim())problems.push(`${scene.name||'未命名场景'}：${field}内容`)}}
  const names=scenes?(value.scenes||[]).map(s=>s.name.trim().toLowerCase()).filter(Boolean):[];if(new Set(names).size!==names.length)problems.push('业务场景名称重复');
 }
 if(did==='DIM-12')value.values?.forEach((v,i)=>{if(i===15?typeof v!=='string'||!v.trim():!['yes','no'].includes(v))problems.push(`第 ${i+1} 项运维指标未完成`)});
 return problems;
}

 item.current=cloneDim01(next);item.applied=true;item.appliedAt=appliedAt;delete item.draft;delete item.autoDirty;ui.restoreUndo=null;

window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data?.type)return;const msg=event.data;if(event.source===document.getElementById('dim01-core-frame')?.contentWindow){if(msg.type==='bg-dim01-ready'){if(!ui.dim01Seed&&msg.seed)ui.dim01Seed=msg.seed;sendDim01State();return}if(msg.type==='bg-dim01-save-full'){saveDim01Full(msg.snapshot);return}if(msg.type==='bg-dim01-apply'){workspaceApplySnapshot('DIM-01',msg.snapshot);return}if(msg.type==='bg-dim01-save-draft'){workspaceSaveDraft();return}if(msg.type==='bg-dim01-save'){saveDim01Patch(msg);return}if(msg.type==='bg-dim01-active'){ui.dim01Section=msg.id;document.querySelectorAll('.dim01-modules button').forEach(b=>b.classList.toggle('active',b.dataset.section===ui.dim01Section))}return}if(event.source===document.getElementById('dim02-core-frame')?.contentWindow){if(msg.type==='bg-dim02-ready'){if(!ui.dim02Seed&&msg.seed)ui.dim02Seed=msg.seed;sendDim02State();return}if(msg.type==='bg-dim02-save'){saveDim02Patch(msg);return}if(msg.type==='bg-dim02-draft'){saveDim02Draft(msg);return}if(msg.type==='bg-dim02-publish'){publishDim02Draft(msg);return}}if(event.source===document.getElementById('dim03-core-frame')?.contentWindow){if(msg.type==='bg-dim03-ready'){if(!ui.dim03Seed&&msg.seed)ui.dim03Seed=msg.seed;sendDim03State();return}if(msg.type==='bg-dim03-save-full'){saveDim03Full(msg.snapshot);return}if(msg.type==='bg-dim03-apply'){workspaceApplySnapshot('DIM-03',msg.snapshot);return}if(msg.type==='bg-dim03-save-draft'){workspaceSaveDraft();return}if(msg.type==='bg-dim03-save'){saveDim03Patch(msg);return}if(msg.type==='bg-dim03-active'){ui.dim01Section=msg.id;document.querySelectorAll('.dim01-modules button').forEach(b=>b.classList.toggle('active',b.dataset.section===ui.dim01Section));return}}if(event.source===document.getElementById('dim04-core-frame')?.contentWindow){if(msg.type==='bg-dim04-ready'){if(!ui.dim04Seed&&msg.seed)ui.dim04Seed=msg.seed;sendDim04State();return}if(msg.type==='bg-dim04-save-full'){saveDim04Full(msg.snapshot);return}if(msg.type==='bg-dim04-apply'){workspaceApplySnapshot('DIM-04',msg.snapshot);return}if(msg.type==='bg-dim04-save-draft'){workspaceSaveDraft();return}if(msg.type==='bg-dim04-save'){saveDim04Patch(msg);return}if(msg.type==='bg-dim04-active'){ui.dim01Section=msg.id;document.querySelectorAll('.dim01-modules button').forEach(b=>b.classList.toggle('active',b.dataset.section===ui.dim01Section));return}}});
document.addEventListener('click',event=>{let el=event.target.closest('[data-act]');if(!el)return;if(el.dataset.act==='mask-close'&&event.target.closest('.modal'))return;if(el.dataset.act==='drawer-mask-close'&&event.target.closest('.drawer'))return;handle(el.dataset.act,el)});
document.addEventListener('input',event=>{if(event.target.id==='research-supplement'){ui.researchSupplement=event.target.value;const bag=projectSurvey();bag.supplement=ui.researchSupplement;saveSurveyStore();return}if(event.target.id==='body-editor')onEditorInput(event.target.value);if(event.target.dataset.input==='search'){ui.search=event.target.value;let e=document.getElementById('main');if(e){let x=e.querySelector('.table-wrap');if(x){let html=projectsPage();let temp=document.createElement('div');temp.innerHTML=html;let y=temp.querySelector('.table-wrap');if(y)x.innerHTML=y.innerHTML}}}});
document.addEventListener('change',async event=>{let el=event.target;if(el&&(el.id==='dashboard-start'||el.id==='dashboard-end')){if(el.id==='dashboard-start')ui.dashboardStart=el.value;else ui.dashboardEnd=el.value;loadPlanningDashboard(true);return}if(el.dataset.change==='sort'){ui.sort=el.value;render();return}if(el.dataset.change==='cycle'){ui.cycleId=el.value;round1Run=null;render();loadRound1Status();return}if(el.id==='upload-md'&&el.files?.length){const file=el.files[0];if(file.size>3e6){toast('单份文件仅支持3MB以内的MD文件');return}try{const text=await file.text();let c=cycle();if(!c){toast('请先开启研究周期');return}c.files??=[];const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));const sha256=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');if(c.files.some(f=>f.sha256===sha256)){toast('本周期已有相同内容的MD文件');return}c.files.push({id:uid('md'),name:file.name,text,sha256,projectId:ui.projectId,dimensionId:ui.dimId,cycleId:c.id,packageVersion:c.taskVersions?.at(-1)?.version||null,kind:'初研',confirmed:false,uploadedAt:now()});persist();render();toast('已在本机接收MD，请确认项目/维度/周期/批次归属')}catch(e){toast('MD文件读取失败，请检查文件访问权限')}return}if(el.id==='import-body-md'&&el.files?.length){let f=el.files[0];if(f.size>3e6){toast('单份文件仅支持3MB以内MD');return}try{openModal('import',{fileName:f.name,text:await f.text()})}catch(e){toast('无法读取选中的MD文件')}return}});
