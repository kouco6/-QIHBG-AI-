function renderPlatformText(){
 const main=document.querySelector('main');main.hidden=true;
 let article=document.querySelector('.platform-text');
 if(!article){article=document.createElement('article');article.className='platform-text';document.body.appendChild(article)}
 const lines=['技术先进',...data.published.flatMap(row=>['',...FIELDS.map(([key,label])=>label+'：'+(row[key]||'—'))]),'','先进性分析'];
 for(const tech of Object.values(data.analysisPublished)){
  lines.push('',tech.subtitle,tech.source,tech.overall,tech.scope);
  for(const point of tech.points){
   lines.push('',point.title,point.summary,point.performance,point.benchmark,point.difference,point.reason,point.value,point.supplement);
   for(const id of point.evidence||[]){
    const source=data.evidencePublished[id];
    if(source)lines.push(source.title,source.publisher,source.where,source.excerpt,source.support,source.note,source.url);
   }
  }
 }
 article.textContent=lines.join('\n');
}

function renderOne(){let rs=rows();let total=Math.max(1,Math.ceil(rs.length/15));ui.page=Math.min(Math.max(1,ui.page),total);let visible=rs.slice((ui.page-1)*15,ui.page*15);$('moduleOne').innerHTML=`<div class="section-head"><div><div class="section-kicker">TECHNOLOGY OVERVIEW</div><h2>行业先进技术综合表</h2><p>八字段同屏展示 · 多行指标完整换行 · ${rs.length} 项技术</p></div><div class="section-actions"><span class="pill blue">行业技术信息</span>${isWork()?'<button class="btn primary" data-action="add-row">＋ 新增技术</button>':'<span class="pill">只读预览</span>'}</div></div><div class="table-outer"><table class="tech-table" aria-label="技术先进八字段综合表"><colgroup><col style="width:12%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:15%"><col style="width:14%"><col style="width:16%"><col style="width:15%"></colgroup><thead><tr>${FIELDS.map(f=>`<th scope="col">${esc(f[1])}${f[0]==='company'?'<span style="display:block;font-size:9px;font-weight:500;color:#8499b0">人工填写</span>':''}</th>`).join('')}</tr></thead><tbody>${visible.map((r,j)=>`<tr data-row="${esc(r.id)}"><td>${cellHTML(r,'name',(ui.page-1)*15+j)}</td>${FIELDS.slice(1).map(f=>`<td>${cellHTML(r,f[0])}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="8" style="padding:40px;text-align:center;color:#889cb2">暂无技术记录，工作模式可新增技术</td></tr>'}</tbody></table></div><div class="table-foot"><div class="table-guide">每页15项 · 第 ${ui.page} / ${total} 页</div><div class="pages">${isWork()&&ui.page>1?'<button class="btn sm drop-page" data-drop-page="prev" aria-label="拖动到上一页">拖至上页 ◂</button>':''}<button class="btn sm" data-action="page-prev" ${ui.page<=1?'disabled':''}>上一页</button><span class="pill">${ui.page} / ${total}</span><button class="btn sm" data-action="page-next" ${ui.page>=total?'disabled':''}>下一页</button>${isWork()&&ui.page<total?'<button class="btn sm drop-page" data-drop-page="next" aria-label="拖动到下一页">▸ 拖至下页</button>':''}</div></div><div class="work-help">${isWork()?'单击选中 · 双击单元格原位编辑 · Enter 换行 · Ctrl / ⌘ + Enter 确认 · Tab 跳格 · Esc 取消 · 支持 Excel 多行多列粘贴、整批撤销及行拖动':'预览模式：只展示最近一次「保存并应用」的正式数据，不含未应用的工作草稿。'}</div>`;
}
function cellHTML(row,field,index){const val=row[field]||'';let isName=field==='name';let selected=ui.selected?.id===row.id&&ui.selected?.field===field;let inEdit=ui.editing?.id===row.id&&ui.editing?.field===field;let code=`data-id="${esc(row.id)}" data-field="${field}"`;let value=esc(val);if(field==='company'&&!value)value=isWork()?'<span class="company-placeholder">双击人工填写</span>':'<span class="company-placeholder">—</span>';let action=isWork()&&isName?`<button class="handle" title="按住拖动以排序" type="button" draggable="true" data-drag="${esc(row.id)}" tabindex="0">⠿</button><button class="row-delete" title="删除该技术" type="button" data-action="delete-row" data-id="${esc(row.id)}">✕</button>`:'';return `<div class="cell ${isName?'cell-name':''} ${!val&&field==='company'?'empty-company':''} ${selected?'selected':''}" ${code} tabindex="0" title="${isWork()?'双击编辑，单击选中以粘贴Excel数据':'只读内容'}">${inEdit?`<textarea class="cell-edit" data-editor="true" spellcheck="false">${esc(ui.editing.draft)}</textarea>`:value}${action}</div>`}
function commitCell(keep=false){const e=ui.editing;if(!e)return;const row=data.work.find(x=>x.id===e.id);if(!row){ui.editing=null;renderOne();return}let input=document.querySelector('textarea[data-editor="true"]');let next=input?input.value:e.draft;if(next!==row[e.field]){pushUndo();row[e.field]=next;if(e.field==='company'&&next.trim())row.companyTouched=true;markDirty()}ui.editing=null;if(!keep)renderOne();}
function startCell(id,field){if(!isWork())return;if(ui.editing)commitCell(true);const row=data.work.find(x=>x.id===id);if(!row)return;ui.selected={id,field};ui.editing={id,field,draft:row[field]||''};renderOne();const ta=document.querySelector('textarea[data-editor="true"]');ta?.focus();ta?.setSelectionRange(ta.value.length,ta.value.length);}
function focusNeighbor(id,field){const index=FIELDS.findIndex(f=>f[0]===field);if(index<7)startCell(id,FIELDS[index+1][0]);else{let pos=data.work.findIndex(x=>x.id===id);if(pos+1<data.work.length){ui.page=Math.floor((pos+1)/15)+1;startCell(data.work[pos+1].id,'name')}else{renderOne();notify('已到达表格末尾')}}}
function undo(){if(ui.editing){notify('编辑框内请使用系统文本撤销；Esc 可取消本次编辑');return}const h=history.pop();if(!h)return;data.work=h.work;data.analysisWork=h.analysisWork;data.evidenceWork=h.evidenceWork||clone(EVIDENCE_SEED);markDirty();render();notify('已撤销上一步工作区操作')}
function addRow(){if(!isWork())return;pushUndo();const id='user_'+Date.now().toString(36)+Math.floor(Math.random()*1000);data.work.unshift({id,...Object.fromEntries(FIELDS.map(f=>[f[0],'' ])),aiInitial:false,companyTouched:false});ui.page=1;ui.selected={id,field:'name'};markDirty();render();notify('已在首行新增技术，双击单元格填写')}
function removeRow(id){const row=data.work.find(x=>x.id===id);if(!row)return;showModal(`<h3 id="dialogHeading">删除技术</h3><p class="modal-description">确定删除「${esc(row.name||'未命名技术')}」及其八字段工作区内容？正式预览在保存并应用前不会改变。</p><div class="modal-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn red" data-action="confirm-delete" data-id="${esc(id)}">确认删除</button></div>`)}

function reorderRow(source,target,edge){if(!source||!target||source===target)return;let arr=data.work;let from=arr.findIndex(x=>x.id===source),to=arr.findIndex(x=>x.id===target);if(from<0||to<0)return;pushUndo();const [record]=arr.splice(from,1);to=arr.findIndex(x=>x.id===target);arr.splice(to+(edge==='after'?1:0),0,record);markDirty();ui.page=Math.floor(arr.findIndex(x=>x.id===source)/15)+1;renderOne();notify('已调整技术顺序')}
function nextPageDrag(source,dir){let arr=data.work;let i=arr.findIndex(x=>x.id===source);if(i<0)return;let targetIndex=dir==='next'?Math.min(arr.length-1,ui.page*15):Math.max(0,(ui.page-1)*15-1);if(i===targetIndex)return;pushUndo();const [row]=arr.splice(i,1);arr.splice(targetIndex,0,row);markDirty();ui.page=Math.floor(targetIndex/15)+1;renderOne();notify('已跨页调整技术位置')}
function parseClipboard(e){let html=e.clipboardData?.getData('text/html');if(html&&/<table[\s>]/i.test(html)){let doc=new DOMParser().parseFromString(html,'text/html');let table=doc.querySelector('table');if(table){let rs=[...table.querySelectorAll('tr')].map(tr=>[...tr.children].filter(c=>/^(TD|TH)$/i.test(c.tagName)).map(c=>{let t=c.cloneNode(true);t.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));t.querySelectorAll('p,div').forEach(n=>n.append(document.createTextNode('\n')));return t.textContent.replace(/\n+$/,'')}));if(rs.length&&rs[0].length)return rs;}}let txt=e.clipboardData?.getData('text/plain')||'';return parseTSV(txt);}
function parseTSV(text){let out=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&q&&text[i+1]==='"'){cell+='"';i++;continue}if(c==='"'&&(q||cell==='')){q=!q;continue}if(!q&&c==='\t'){row.push(cell);cell='';continue}if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell='';continue}cell+=c}row.push(cell);if(row.length>1||row[0]!==''||out.length===0)out.push(row);return out}
function applyPaste(e){if(!isWork()||!ui.selected||ui.editing)return;const cells=parseClipboard(e);if(!cells.length)return;e.preventDefault();let rowIndex=data.work.findIndex(x=>x.id===ui.selected.id);let colIndex=FIELDS.findIndex(f=>f[0]===ui.selected.field);if(rowIndex<0||colIndex<0)return;pushUndo();cells.forEach((values,i)=>{while(rowIndex+i>=data.work.length){data.work.push({id:'paste_'+Date.now()+'_'+data.work.length,...Object.fromEntries(FIELDS.map(f=>[f[0],'' ])),aiInitial:false,companyTouched:false})}const row=data.work[rowIndex+i];values.forEach((value,j)=>{if(colIndex+j<8){const field=FIELDS[colIndex+j][0];row[field]=value;if(field==='company'&&value.trim())row.companyTouched=true}})});markDirty();ui.page=Math.floor(rowIndex/15)+1;renderOne();notify(`已按位置粘贴 ${cells.length} 行；整次操作可撤销`)}
function validate(){const errors=[];for(let i=0;i<data.work.length;i++){const r=data.work[i];const hasContent=FIELDS.some(f=>String(r[f[0]]||'').trim());if(!hasContent)continue;FIELDS.forEach(([field,label])=>{if(field==='company'&&r.aiInitial&&!r.companyTouched&&!String(r.company||'').trim())return;if(!String(r[field]||'').trim())errors.push({id:r.id,field,label,row:i+1,name:r.name||'未命名技术'})})}return errors}

function applyAll(){if(!isWork())return; if(ui.editing)commitCell(true);const errors=validate();if(errors.length){showModal(`<h3 id="dialogHeading">存在尚未完成的字段</h3><p class="modal-description">已保留当前工作草稿。请完成下列字段后统一应用；AI 初稿中未填写的公司指标按 Q36 例外允许留空。</p><div class="errorlist"><ol>${errors.slice(0,24).map(e=>`<li><button class="btn sm linkish" data-action="jump-error" data-id="${esc(e.id)}" data-field="${esc(e.field)}">第 ${e.row} 行 · ${esc(e.name)} · ${esc(e.label)} → 定位</button></li>`).join('')}</ol>${errors.length>24?`另有${errors.length-24}处未列出`:''}</div><div class="modal-actions"><button class="btn primary" data-action="modal-close">返回填写</button></div>`);return}data.published=clone(data.work.filter(r=>FIELDS.some(f=>String(r[f[0]]||'').trim())));data.analysisPublished=clone(data.analysisWork);data.evidencePublished=clone(data.evidenceWork);data.appliedAt=time();ui.dirty=false;saveLocal();render();notify('已保存并应用：正式预览更新为当前完整成果')}
function proofStats(t){let ids=t.points.flatMap(p=>p.evidence||[]),book=evidenceBook(),urls=new Set(ids.map(k=>book[k]?.url).filter(Boolean));return {total:ids.length,unique:urls.size};}
function sourceMarkup(id,techId,pointId){const s=evidenceBook()[id];if(!s)return '';let validLink=/^https?:\/\//i.test(s.url||'');let original=s.excerpt?`<div class="proof-original"><span class="proof-original-label">原文短摘录</span><blockquote lang="en">“${esc(s.excerpt)}”</blockquote></div>`:`<div class="proof-original empty-excerpt">该出处提供原始资料链接；未录入可核验的原文短摘录。</div>`;return `<div class="proof-row" id="proof-${esc(id)}"><div class="proof-identity"><span class="proof-id">${esc(s.id||id)}</span><span class="proof-tag">${esc(s.support||'原文依据')}</span></div><div class="proof-main"><div class="proof-title">${esc(s.title||'未命名来源')}</div><div class="proof-meta">${esc(s.publisher||'来源机构未注明')}　·　${esc(s.where||'需补充具体出处')}</div>${original}<div class="proof-meaning"><span>支持论点</span>${esc(s.note||'请具体填写本条原文支持的判断')}</div></div><div class="proof-actions">${validLink?`<a class="proof-open" target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">打开原始出处 ↗</a>`:'<span class="proof-no-link">未提供有效链接</span>'}${isWork()?`<button class="btn sm" data-action="edit-evidence" data-tech="${esc(techId)}" data-point="${esc(pointId)}" data-id="${esc(id)}">编辑</button><button class="btn sm" data-action="unlink-evidence" data-tech="${esc(techId)}" data-point="${esc(pointId)}" data-id="${esc(id)}">移除</button>`:''}</div></div>`;}
function renderTwo(){if(isWork())ensureAnalysisEntries();let entries=analyses(),arr=Object.values(entries);if(!entries[ui.tech])ui.tech=arr[0]?.id||'';let t=entries[ui.tech];$('moduleTwo').innerHTML=`<div class="section-head proof-page-head"><div><div class="section-kicker">SOURCE FIRST · ORIGINAL EVIDENCE</div><h2>行业技术先进性 · 原文依据</h2><p>每条技术结论都能追溯到具体原文；所有已关联依据逐条列出，不只展示一条。</p></div><div class="section-actions"><span class="pill blue">${arr.length} 项技术</span><span class="pill">全部原文依据默认可见</span></div></div><div class="analysis-grid"><aside class="directory" aria-label="行业技术目录"><div class="directory-title">行业技术目录</div><div class="directory-note">选择技术 · 核验原文出处</div>${arr.map((x,i)=>`<button class="directory-btn ${ui.tech===x.id?'on':''}" data-action="select-tech" data-tech="${esc(x.id)}"><b>${String(i+1).padStart(2,'0')} · ${esc(rows().find(z=>z.id===x.id)?.name||x.subtitle)}</b><small>${esc(x.category)} · ${proofStats(x).total} 条原文依据</small></button>`).join('')}</aside><div class="details">${t?renderAnalysisDetails(t):'<div>暂无分析资料</div>'}</div></div>`;}

function showModal(html){$('modalContent').innerHTML=html;$('modalLayer').classList.remove('hidden');document.body.style.overflow='hidden'}function hideModal(){$('modalLayer').classList.add('hidden');$('modalContent').innerHTML='';document.body.style.overflow=''}
function techModal(id){const t=data.analysisWork[id];showModal(`<h3 id="dialogHeading">编辑技术总体分析</h3><p class="modal-description">仅编辑当前技术的行业先进性结论，不涉及公司指标。</p><label>技术来源与技术定义</label><textarea id="editSource">${esc(t.source)}</textarea><label>整体先进性结论</label><textarea id="editOverall">${esc(t.overall)}</textarea><label>结论成立范围与证据边界</label><textarea id="editScope">${esc(t.scope)}</textarea><div class="modal-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="save-tech" data-tech="${esc(id)}">确认修改</button></div>`)}
function pointModal(techId,pointId){const t=data.analysisWork[techId];const p=t.points.find(x=>x.id===pointId)||{title:'',summary:'',performance:'',benchmark:'',difference:'',reason:'',value:'',supplement:'',evidence:[]};const options=Object.keys(data.evidenceWork).map(id=>`<option value="${esc(id)}" ${p.evidence?.includes(id)?'selected':''}>${esc(data.evidenceWork[id].id||id)} · ${esc(data.evidenceWork[id].title)}</option>`).join('');showModal(`<h3 id="dialogHeading">${pointId?'编辑':'新增'}先进点</h3><p class="modal-description">五项专业信息与并列对照结构；来源需真实可点击并与论点对应。</p><label>先进点名称</label><input id="pointTitle" value="${esc(p.title)}"><label>摘要：核心差异与实际价值</label><textarea id="pointSummary">${esc(p.summary)}</textarea><div class="modal-grid"><div><label>行业先进技术表现</label><textarea id="pointPerformance">${esc(p.performance)}</textarea></div><div><label>有效行业对标基准</label><textarea id="pointBenchmark">${esc(p.benchmark)}</textarea></div></div><label>已证实的先进差异</label><textarea id="pointDifference">${esc(p.difference)}</textarea><div class="modal-grid"><div><label>先进原因 / 技术机制</label><textarea id="pointReason">${esc(p.reason)}</textarea></div><div><label>实际应用价值</label><textarea id="pointValue">${esc(p.value)}</textarea></div></div><label>补充基准及成立边界</label><textarea id="pointSupplement">${esc(p.supplement)}</textarea><label>关联现有原文依据（Ctrl / ⌘ 多选）；亦可直接从页面添加新证据</label><select id="pointEvidence" multiple style="width:100%;min-height:75px;border:1px solid #cbd9ea;border-radius:8px;padding:7px">${options}</select><div class="modal-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="save-point" data-tech="${esc(techId)}" data-id="${esc(pointId||'')}">确认修改</button></div>`)}
function saveTech(id){const t=data.analysisWork[id];if(!t)return;pushUndo();t.source=$('editSource').value;t.overall=$('editOverall').value;t.scope=$('editScope').value;markDirty();hideModal();renderTwo();notify('总体结论已更新到工作草稿')}
function savePoint(techId,pointId){const t=data.analysisWork[techId];if(!t)return;const values={title:$('pointTitle').value.trim(),summary:$('pointSummary').value,performance:$('pointPerformance').value,benchmark:$('pointBenchmark').value,difference:$('pointDifference').value,reason:$('pointReason').value,value:$('pointValue').value,supplement:$('pointSupplement').value,evidence:[...$('pointEvidence').selectedOptions].map(o=>o.value)};if(!values.title){notify('请先填写先进点名称');$('pointTitle').focus();return;}pushUndo();if(pointId){Object.assign(t.points.find(x=>x.id===pointId),values)}else{pointId='new_'+Date.now().toString(36);t.points.push({id:pointId,...values})}ui.expanded[pointId]=true;markDirty();hideModal();renderTwo();notify('先进点已更新到工作草稿')}
function evidenceModal(techId,pointId,evidId){if(!isWork())return;const existing=evidId?data.evidenceWork[evidId]:null;const ev=existing||{title:'',publisher:'',where:'',url:'',excerpt:'',support:'',note:''};showModal(`<h3 id="dialogHeading">${evidId?'编辑':'新增'}原文依据</h3><p class="modal-description">每条原文独立保存完整出处、短摘录、支持论点和原始链接；一条先进点可以包含任意多条依据。</p><div class="modal-grid"><div><label>原始文献/网页名称</label><input id="evTitle" value="${esc(ev.title)}" placeholder="例如：某标准版本的官方摘要"></div><div><label>发布机构</label><input id="evPublisher" value="${esc(ev.publisher)}" placeholder="标准组织/研究机构"></div></div><label>原文位置（章节/页码/网页栏目）</label><input id="evWhere" value="${esc(ev.where)}" placeholder="例如：标准正文第5.1节"><label>原始出处链接（必须是 https:// 或 http://）</label><input id="evUrl" value="${esc(ev.url)}" placeholder="https://..."><label>可核验的原文短摘录（不要编造或改写成引文）</label><textarea id="evExcerpt" placeholder="只填写确实存在于原始资料中的短句">${esc(ev.excerpt)}</textarea><label>这条原文支持的具体论点</label><input id="evSupport" value="${esc(ev.support)}" placeholder="例如：同步方式 / 延时范围"><label>解读（用自己的话说明原文证实了什么及其边界）</label><textarea id="evNote" placeholder="避免泛泛的“来源支持先进”">${esc(ev.note)}</textarea><div class="modal-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="save-evidence" data-tech="${esc(techId)}" data-point="${esc(pointId)}" data-id="${esc(evidId||'')}">保存该条原文依据</button></div>`);}
function saveEvidence(techId,pointId,evidId){const t=data.analysisWork[techId];const p=t?.points.find(x=>x.id===pointId);if(!p)return;const vals={title:$('evTitle').value.trim(),publisher:$('evPublisher').value.trim(),where:$('evWhere').value.trim(),url:$('evUrl').value.trim(),excerpt:$('evExcerpt').value.trim(),support:$('evSupport').value.trim(),note:$('evNote').value.trim()};try{const u=new URL(vals.url);if(!['https:','http:'].includes(u.protocol))throw new Error('bad')}catch{notify('请提供有效的 http(s) 原始出处链接');$('evUrl').focus();return}if(!vals.title||!vals.publisher||!vals.support){notify('请填写来源名称、发布机构及对应论点');return}pushUndo();if(!evidId){evidId='custom_'+Date.now().toString(36)+'_'+Math.floor(Math.random()*1000);p.evidence ||= [];p.evidence.push(evidId);}data.evidenceWork[evidId]={id:evidId.startsWith('custom_')?'U'+String(p.evidence.length).padStart(2,'0'):(data.evidenceWork[evidId]?.id||evidId),...vals};markDirty();hideModal();renderTwo();notify('原文依据已加入工作草稿；正式预览需保存并应用');}
function unlinkEvidence(techId,pointId,evidId){const t=data.analysisWork[techId];const p=t?.points.find(x=>x.id===pointId);if(!p)return;pushUndo();p.evidence=(p.evidence||[]).filter(x=>x!==evidId);markDirty();renderTwo();notify('已从当前先进点移除该条关联依据，可撤销');}
function actionHandler(el){const act=el.dataset.action;if(!act)return;const id=el.dataset.id,techId=el.dataset.tech,pointId=el.dataset.point;switch(act){case'tab-one':ui.module='one';render();break;case'tab-two':ui.module='two';render();break;case'add-row':addRow();break;case'delete-row':removeRow(id);break;case'confirm-delete':confirmDelete(id);break;case'page-prev':ui.page--;renderOne();break;case'page-next':ui.page++;renderOne();break;case'select-tech':ui.tech=techId;renderTwo();break;case'toggle-point':ui.expanded[id]=!ui.expanded[id];renderTwo();break;case'edit-tech':techModal(techId);break;case'save-tech':saveTech(techId);break;case'edit-point':pointModal(techId,id);break;case'add-point':pointModal(techId,null);break;case'add-evidence':evidenceModal(techId,pointId,null);break;case'edit-evidence':evidenceModal(techId,pointId,id);break;case'save-evidence':saveEvidence(techId,pointId,id);break;case'unlink-evidence':unlinkEvidence(techId,pointId,id);break;case'save-point':savePoint(techId,id);break;case'remove-point':{const t=data.analysisWork[techId];const p=t?.points.find(x=>x.id===id);if(!p)break;showModal(`<h3 id="dialogHeading">删除先进点</h3><p class="modal-description">确认删除「${esc(p.title)}」？仅影响工作草稿，正式预览在保存并应用后才更新。</p><div class="modal-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn red" data-action="confirm-delete-point" data-tech="${esc(techId)}" data-id="${esc(id)}">删除先进点</button></div>`);break}case'confirm-delete-point':pushUndo();data.analysisWork[techId].points=data.analysisWork[techId].points.filter(x=>x.id!==id);markDirty();hideModal();renderTwo();notify('已删除工作草稿中的先进点');break;case'jump-error':{let idx=data.work.findIndex(x=>x.id===id);ui.module='one';ui.page=Math.floor(idx/15)+1;ui.selected={id,field:el.dataset.field};hideModal();render();setTimeout(()=>document.querySelector('.cell.selected')?.focus(),25);break}case'modal-close':hideModal();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();actionHandler(el);return}const c=e.target.closest('.cell');if(c&&isWork()&&!ui.editing){ui.selected={id:c.dataset.id,field:c.dataset.field};document.querySelectorAll('.cell.selected').forEach(x=>x.classList.remove('selected'));c.classList.add('selected')}});
document.addEventListener('dblclick',e=>{const c=e.target.closest('.cell');if(c&&isWork()&&!e.target.closest('button'))startCell(c.dataset.id,c.dataset.field)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.editing){ui.editing=null;renderOne();return}if(!$('modalLayer').classList.contains('hidden'))hideModal();return}if(ui.editing&&e.target.matches('textarea[data-editor="true"]')){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();commitCell();notify('单元格编辑已确认');return}if(e.key==='Tab'){e.preventDefault();const {id,field}=ui.editing;commitCell(true);focusNeighbor(id,field);return}return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&isWork()&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='INPUT'){e.preventDefault();undo()}});
document.addEventListener('focusout',e=>{if(e.target.matches('textarea[data-editor="true"]')&&ui.editing){let ta=e.target;const editing=ui.editing;setTimeout(()=>{if(ui.editing===editing&&document.activeElement!==ta)commitCell()},0)}});
document.addEventListener('paste',applyPaste);
document.addEventListener('dragstart',e=>{const handle=e.target.closest('[data-drag]');if(!handle||!isWork())return;ui.dragId=handle.dataset.drag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',ui.dragId)});
document.addEventListener('dragover',e=>{if(!ui.dragId)return;const row=e.target.closest('tr[data-row]'),page=e.target.closest('[data-drop-page]');if(row||page){e.preventDefault();e.dataTransfer.dropEffect='move';page?.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest('[data-drop-page]')?.classList.remove('over')});
document.addEventListener('drop',e=>{if(!ui.dragId)return;const row=e.target.closest('tr[data-row]'),page=e.target.closest('[data-drop-page]');if(row){e.preventDefault();const id=ui.dragId;ui.dragId=null;reorderRow(id,row.dataset.row,e.clientY>row.getBoundingClientRect().top+row.getBoundingClientRect().height/2?'after':'before')}else if(page){e.preventDefault();const id=ui.dragId;ui.dragId=null;nextPageDrag(id,page.dataset.dropPage)}});
document.addEventListener('dragend',()=>{ui.dragId=null;document.querySelectorAll('.drop-page.over').forEach(e=>e.classList.remove('over'))});
$('tabOne').addEventListener('click',()=>{if(ui.editing)commitCell(true);ui.module='one';render()});$('tabTwo').addEventListener('click',()=>{if(ui.editing)commitCell(true);ui.module='two';render()});$('workMode').addEventListener('click',()=>{ui.mode='work';render()});$('previewMode').addEventListener('click',()=>{if(ui.editing)commitCell(true);ui.mode='preview';render()});$('undoBtn').addEventListener('click',undo);$('draftBtn').addEventListener('click',saveDraft);$('applyBtn').addEventListener('click',applyAll);$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))hideModal()});
function convertSnapshot(value){
 if(value?.format==='v1.1')return clone(value);
 if(Array.isArray(value?.topics)){
  const rows=value.topics.map(t=>({id:t.id,name:t.title,source:(t.sections?.[0]?.paragraphs||[]).join('\n'),maturity:(t.sections?.[1]?.paragraphs||[]).join('\n'),leading:(t.sections?.[2]?.paragraphs||[]).join('\n'),barrier:(t.sections?.[3]?.paragraphs||[]).join('\n'),value:(t.sections?.[4]?.paragraphs||[]).join('\n'),company:(t.benchmark||[]).map(r=>r.company).filter(Boolean).join('\n'),industry:(t.benchmark||[]).map(r=>r.industry).filter(Boolean).join('\n'),aiInitial:false,companyTouched:true}));
  const analysis=Object.fromEntries(value.topics.map(t=>[t.id,{id:t.id,category:'旧版研究待核验',subtitle:t.title,source:t.subtitle,overall:'旧版资料已迁移，需补充原文依据后核验行业先进性。',scope:t.difference||'',points:[]}]));
  return {format:'v1.1',rows,analysis,evidence:{}};
 }
 return {format:'v1.1',rows:clone(SAMPLE_ROWS),analysis:clone(SAMPLE_ANALYSIS),evidence:clone(EVIDENCE_SEED)};
}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent)return;const m=event.data||{};if(m.type==='bg-dim04-state'){
 const v=convertSnapshot(m.content);ui.mode=m.workMode?'work':'preview';ui.module=m.module==='moduleTwo'?'two':'one';if(ui.mode==='work'){data.work=v.rows;data.analysisWork=v.analysis;data.evidenceWork=v.evidence}else{data.published=v.rows;data.analysisPublished=v.analysis;data.evidencePublished=v.evidence}ui.editing=null;ui.dirty=false;render();return}
 if(m.type==='bg-dim04-command'){if(ui.editing)commitCell(true);if(m.action==='publish')window.parent.postMessage({type:'bg-dim04-apply',snapshot:workSnapshot()},location.origin);if(m.action==='save-draft')window.parent.postMessage({type:'bg-dim04-save-draft'},location.origin);return}
 if(m.type==='bg-dim04-section'){ui.module=m.id==='moduleTwo'?'two':'one';render()}
});
render();window.parent.postMessage({type:'bg-dim04-ready',seed:{format:'v1.1',rows:clone(SAMPLE_ROWS),analysis:clone(SAMPLE_ANALYSIS),evidence:clone(EVIDENCE_SEED)}},location.origin);
</script>
</body>
</html>
