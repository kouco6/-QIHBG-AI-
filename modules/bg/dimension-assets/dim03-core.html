 $('#undoBtn').disabled=undoStack.length===0;
 $('#hint').innerHTML=(mode==='work'?'双击单元格编辑　·　Enter / Tab连续录入　·　Ctrl+V粘贴Excel数据　·　拖动行首手柄排序　·　Ctrl+Z撤销。':'预览模式仅查看已应用成果，不显示任何编辑控件。')+'<br>演示数据仅用于查看页面效果，不代表任何企业真实资质情况。';
 const real=data.filter(hasContent);$('#recordInfo').textContent='共 '+real.length+' 条';$('#yesCount').textContent=real.filter(x=>x.owned==='是').length;$('#noCount').textContent=real.filter(x=>x.owned==='否').length;
 if(mode==='preview'&&!real.length){$('#rows').innerHTML='<tr><td colspan="7"><div class="empty-preview"><strong>暂无正式资质内容</strong>请切换工作模式录入并保存应用</div></td></tr>'}
 else {
  $('#rows').innerHTML=(mode==='work'&&page===0?'<tr class="empty-row"><td>＋</td><td colspan="6"><button class="new-prompt" data-action="add">＋ 默认空白编辑行 · 点击开始录入</button></td></tr>':'')+
  data.slice(page*pageSize,(page+1)*pageSize).map(r=>{
   const isSelected=selected?.id===r.id;
   return '<tr class="data-row '+(isSelected&&mode==='work'?'row-selected':'')+'" data-row="'+esc(r.id)+'"><td>'+(mode==='work'?'<button draggable="true" class="grip" title="按住拖动以调整排序" aria-label="拖动资质行" data-drag="'+esc(r.id)+'">⠿</button>':'')+'</td>'+F.map((f,i)=>{
    const v=String(r[f]??''),invalid=mode==='work'&&missing(f,v);
    const chosen=isSelected&&selected.field===f;
    let display=v?esc(v):'<span class="placeholder">—</span>';
    if(f==='owned'&&['是','否'].includes(v))display='<span class="state-badge '+(v==='是'?'yes':'no')+'">'+v+'</span>';
    const warning=invalid?' title="必填或取值无效，请完善"':'';
    return '<td '+(i===5&&mode==='work'?'class="last-td"':'')+'><div class="rowcell '+(chosen?'active ':'')+(invalid?'invalid':'')+'" tabindex="'+(mode==='work'?'0':'-1')+'" data-id="'+esc(r.id)+'" data-field="'+esc(f)+'"'+warning+'>'+display+'</div>'+(i===5&&mode==='work'?'<button class="delete-btn" data-delete="'+esc(r.id)+'" title="删除本条资质">×</button>':'')+'</td>';}).join('')+'</tr>';}).join('');
 }
 $('#pageCaption').textContent='每页15行 · 第 '+(page+1)+' / '+pc+' 页 · 共 '+activeCount(data)+' 条资质记录';
 let nav='<button data-page="'+(page-1)+'" '+(page===0?'disabled':'')+' aria-label="上一页">‹</button>';
 for(let i=0;i<pc;i++)nav+='<button data-page="'+i+'" '+(i===page?'class="active"':'')+'>'+ (i+1)+'</button>';
 nav+='<button data-page="'+(page+1)+'" '+(page===pc-1?'disabled':'')+' aria-label="下一页">›</button>';
 $('#pager').innerHTML=nav;
}
function selectCell(id,f,scroll=true){selected={id,field:f};const idx=work.findIndex(x=>x.id===id);if(idx>=0)page=Math.floor(idx/pageSize);render();const el=$$('.rowcell').find(x=>x.dataset.id===id&&x.dataset.field===f);if(el){el.focus({preventScroll:true});if(scroll)el.scrollIntoView({block:'nearest',inline:'nearest'});}}
function addRow(){if(mode!=='work')return;finishEdit(true);snapshot();let r=make(['','','','','','']);work.unshift(r);page=0;changed();selectCell(r.id,'name');notice('已在第一行新增资质，可双击填写')}
function beginEdit(cell){if(mode!=='work')return;if(editing)finishEdit(true);const id=cell.dataset.id,f=cell.dataset.field,r=work.find(x=>x.id===id);if(!r)return;selected={id,field:f};editing={id,f,before:r[f]};let el;
 if(f==='owned'||f==='difficulty'||f==='barrier'){
  el=document.createElement('select');let items=f==='owned'?['','是','否']:['','低','中','高','待核实'];if(r[f]&&!items.includes(r[f]))items.push(r[f]);
  el.innerHTML=items.map(x=>'<option value="'+esc(x)+'">'+esc(x||'请选择')+'</option>').join('');el.value=r[f];
 }else if(f==='grade'){
  el=document.createElement('input');el.setAttribute('list','gradeSuggestions');el.value=r[f];el.placeholder=N[F.indexOf(f)];
 }else{el=document.createElement('input');el.value=r[f];el.placeholder=N[F.indexOf(f)];}
 cell.innerHTML='';cell.appendChild(el);cell.classList.add('active');el.focus();if(el instanceof HTMLInputElement)el.select();
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();finishEdit(true,e.key==='Enter'?'enter':'tab')}else if(e.key==='Escape'){e.preventDefault();finishEdit(false)}});
 el.addEventListener('blur',()=>{if(editing?.id===id&&editing?.f===f)finishEdit(true)});
}
function finishEdit(commit,move){if(!editing)return;const {id,f,before}=editing;const editor=$$('.rowcell').find(x=>x.dataset.id===id&&x.dataset.field===f)?.querySelector('input,select');const value=editor?.value??before;editing=null;
 if(commit){const r=work.find(x=>x.id===id);if(r&&r[f]!==value){snapshot();r[f]=value;changed();if(f==='name'&&value&&work.filter(x=>x.id!==id&&x.name.trim()===value.trim()).length)notice('同名资质已存在，请核对；不影响应用')}}
 if(move){let i=work.findIndex(x=>x.id===id),j=F.indexOf(f),target=work[i],tf=f;
  if(move==='enter'&&i<work.length-1)target=work[i+1];
  if(move==='tab'){if(j<F.length-1)tf=F[j+1];else if(i<work.length-1){target=work[i+1];tf=F[0]}}
  if(target)selectCell(target.id,tf);else render();
 }else selectCell(id,f,false);
}
function pasteGrid(text){if(mode!=='work'||!selected)return;const at=work.findIndex(x=>x.id===selected.id),j=F.indexOf(selected.field);if(at<0||j<0)return;let lines=text.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(line=>line.split('\t'));snapshot();let count=0;while(work.length<at+lines.length)work.push(make(['','','','','','']));
 lines.forEach((cols,i)=>cols.forEach((value,k)=>{const field=F[j+k];if(field){work[at+i][field]=value;count++}}));changed();selectCell(work[at].id,F[j],false);notice('已粘贴 '+lines.length+' 行 · '+count+' 个单元格，支持整批撤销');}
function undo(){if(editing){finishEdit(false);return}if(!undoStack.length){notice('当前没有可撤销的操作');return}work=undoStack.pop();selected=null;changed();render();notice('已撤销上一步操作')}
function dialog(title,description,choices){$('#modalRoot').innerHTML='<div class="overlay"><div class="modal"><h3>'+esc(title)+'</h3><p>'+esc(description)+'</p><div class="modal-actions">'+choices.map(c=>'<button class="btn '+(c.danger?'danger':c.primary?'primary':'')+'" data-modal="'+esc(c.id)+'">'+esc(c.text)+'</button>').join('')+'</div></div></div>';}
function closeDialog(){$('#modalRoot').innerHTML='';modalAction=null}
function deleteRow(id){const r=work.find(x=>x.id===id);if(!r)return;modalAction={type:'delete',id};dialog('确认删除资质？','将从当前工作内容中删除「'+(r.name||'未命名资质')+'」。正式预览在保存并应用之前不会改变。',[{id:'cancel',text:'取消'},{id:'confirm',text:'确认删除',danger:true}])}
function apply(){const actual=work.filter(hasContent);if(!actual.length){notice('维度没有有效资质数据，不能发布空成果');return}
 const failing=actual.find(r=>errors(r).length);if(failing){const count=actual.filter(r=>errors(r).length).length;selectCell(failing.id,errors(failing)[0]);notice('有 '+count+' 条资质字段缺失或无效，请修正后统一应用');return}
 if(JSON.stringify(actual)===JSON.stringify(published)){notice('当前内容与正式成果一致，无需重复应用');return}
 published=clone(actual);work=clone(actual);const identical=versions.find(v=>!v.applied&&JSON.stringify(v.records.filter(hasContent))===JSON.stringify(published));if(identical){identical.applied=true;identical.label='保存并应用';identical.appliedTime=stamp()}else versions.unshift({id:'v'+Date.now(),label:'保存并应用',time:stamp(),applied:true,records:clone(published)});
 dirty=false;undoStack=[];persist();$('#savingState').textContent='● 已保存并应用';render();notice('保存并应用成功，预览成果已更新');}
function save(type){if(editing)finishEdit(true);$('#saveMenu').hidden=true;if(type==='apply')return apply();if(type==='draft'){
 const last=versions.find(v=>!v.applied);if(last&&JSON.stringify(last.records)===JSON.stringify(work)){notice('当前内容与已保存草稿相同，无须重复保存');return}
 versions.unshift({id:'v'+Date.now(),label:'手动保存草稿',time:stamp(),applied:false,records:clone(work)});dirty=false;persist();$('#savingState').textContent='● 草稿已保存';notice('草稿已加入版本管理，预览未改变')}}
function drawer(){const root=$('#drawerRoot');root.innerHTML='<div class="drawer-scrim" data-close-drawer></div><aside class="drawer"><div class="drawer-head"><h3>版本管理</h3><button class="btn" data-close-drawer>关闭 ×</button></div><p class="drawer-sub">查看历史时只读；恢复版本只替换工作区内容，正式预览不变。</p>'+versions.map((v,i)=>'<div class="version"><div class="version-head"><span class="version-name">'+esc(v.label)+'</span><span class="version-badge '+(v.applied?'':'draft')+'">'+(v.applied?'已应用版本':'未应用版本')+'</span></div><div class="version-time">'+esc(v.time)+(v.appliedTime?' · 应用 '+esc(v.appliedTime):'')+'　·　'+activeCount(v.records)+' 条资质</div><button class="small-btn" data-version-view="'+i+'">查看</button> <button class="small-btn" data-version-restore="'+i+'">恢复</button></div>').join('')+'</aside>'}
function closeDrawer(){$('#drawerRoot').innerHTML='';viewingVersion=null}
function inspect(i){const v=versions[i];if(!v)return;viewingVersion=i;
 $('#drawerRoot').innerHTML='<div class="drawer-scrim" data-close-drawer></div><aside class="drawer"><div class="drawer-head"><h3>历史版本 · 只读查看</h3><button class="btn" data-version-back>返回列表</button></div><p class="drawer-sub">'+esc(v.time)+' · '+activeCount(v.records)+' 条资质</p><table class="mini-preview"><thead><tr><th>资质名称</th><th>公司拥有</th></tr></thead><tbody>'+v.records.filter(hasContent).map(r=>'<tr><td>'+esc(r.name||'—')+'</td><td>'+esc(r.owned||'—')+'</td></tr>').join('')+'</tbody></table><button class="btn primary inspect-close" data-version-restore="'+i+'">恢复该版本</button></aside>'}
function restore(i){const v=versions[i];if(!v)return;const applyRestore=()=>{snapshot();work=clone(v.records);selected=null;page=0;changed();closeDialog();closeDrawer();render();notice('版本已恢复到工作区，正式预览未改变')};
 closeDrawer();if(dirty){modalAction={type:'restore',index:i,restore:applyRestore};dialog('替换当前工作内容？','当前工作区存在尚未手动保存的修改，请选择如何处理。',[{id:'savefirst',text:'先保存草稿再恢复'},{id:'discard',text:'放弃当前修改并恢复',primary:true},{id:'cancel',text:'取消'}]);}
 else{modalAction={type:'restore',index:i,restore:applyRestore};dialog('确认恢复历史版本？','历史版本将载入工作区，不会自动应用到预览。',[{id:'discard',text:'确认恢复',primary:true},{id:'cancel',text:'取消'}]);}}
function modeChange(to){if(to===mode)return;if(editing)finishEdit(true);mode=to;selected=null;$('#saveMenu').hidden=true;render();if(to==='preview'&&dirty)notice('预览显示最新已应用成果；当前工作修改已暂存');}
// Click delegation
 document.addEventListener('click',e=>{
 const sw=e.target.closest('[data-mode]');if(sw){modeChange(sw.dataset.mode);return}
 if(e.target.closest('#newBtn')||e.target.closest('[data-action="add"]')){addRow();return}
 if(e.target.closest('#undoBtn')){undo();return}
 if(e.target.closest('#versionBtn')){if(editing)finishEdit(true);drawer();return}
 if(e.target.closest('#saveTrigger')){$('#saveMenu').hidden=!$('#saveMenu').hidden;return}
 const saves=e.target.closest('[data-save]');if(saves){save(saves.dataset.save);return}
 const pg=e.target.closest('[data-page]');if(pg&&!pg.disabled){if(editing)finishEdit(true);page=Number(pg.dataset.page);selected=null;render();return}
 const del=e.target.closest('[data-delete]');if(del){if(editing)finishEdit(true);deleteRow(del.dataset.delete);return}
 const issue=e.target.closest('[data-error-row]');if(issue){closeDialog();selectCell(issue.dataset.errorRow,issue.dataset.errorField);return}
 const modal=e.target.closest('[data-modal]');if(modal){const v=modal.dataset.modal,act=modalAction;if(v==='cancel'){closeDialog();return}if(act?.type==='delete'&&v==='confirm'){snapshot();work=work.filter(r=>r.id!==act.id);selected=null;changed();closeDialog();render();notice('该资质已删除，可按Ctrl+Z撤销');return}
  if(act?.type==='restore'){if(v==='savefirst'){save('draft');act.restore();return}if(v==='discard'){act.restore();return}}return}
 if(e.target.closest('[data-close-drawer]')){closeDrawer();return}
 if(e.target.closest('[data-version-back]')){drawer();return}
 const vView=e.target.closest('[data-version-view]');if(vView){inspect(Number(vView.dataset.versionView));return}
 const vRestore=e.target.closest('[data-version-restore]');if(vRestore){restore(Number(vRestore.dataset.versionRestore));return}
 const cell=e.target.closest('.rowcell');if(cell&&mode==='work'&&!editing){selected={id:cell.dataset.id,field:cell.dataset.field};$$('.rowcell.active').forEach(x=>x.classList.remove('active'));cell.classList.add('active');cell.focus({preventScroll:true})}
 });
 document.addEventListener('dblclick',e=>{const cell=e.target.closest('.rowcell');if(cell&&mode==='work')beginEdit(cell)});
 document.addEventListener('paste',e=>{if(mode!=='work'||e.target.matches('input,textarea,select'))return;let text=e.clipboardData?.getData('text/plain');if(text&&selected){e.preventDefault();pasteGrid(text)}});
 document.addEventListener('keydown',e=>{const el=e.target;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!el.matches('input,textarea,select')){e.preventDefault();undo()}});
 document.addEventListener('dragstart',e=>{const handle=e.target.closest('[data-drag]');if(!handle||mode!=='work')return;dragging=handle.dataset.drag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging)});
 document.addEventListener('dragover',e=>{if(!dragging)return;const row=e.target.closest('[data-row]');if(row){e.preventDefault();$$('.drag-over').forEach(x=>x.classList.remove('drag-over'));row.classList.add('drag-over')}
 const pg=e.target.closest('[data-page]');if(pg&&!pg.disabled&&Number(pg.dataset.page)!==page){e.preventDefault();pg.classList.add('page-hover');if(pageHover!==Number(pg.dataset.page)){clearTimeout(hoverTimer);pageHover=Number(pg.dataset.page);hoverTimer=setTimeout(()=>{page=pageHover;pageHover=null;render()},650)}}else if(!pg){clearTimeout(hoverTimer);pageHover=null}});
 document.addEventListener('drop',e=>{if(!dragging)return;e.preventDefault();clearTimeout(hoverTimer);pageHover=null;const row=e.target.closest('[data-row]');if(row&&row.dataset.row!==dragging){const from=work.findIndex(x=>x.id===dragging),to=work.findIndex(x=>x.id===row.dataset.row);if(from>=0&&to>=0){snapshot();const [moved]=work.splice(from,1);const target=from<to?to-1:to;work.splice(target,0,moved);changed();page=Math.floor(target/pageSize);render();notice('已调整资质顺序，可撤销')}}dragging=null;$$('.drag-over').forEach(x=>x.classList.remove('drag-over'))});
 document.addEventListener('dragend',()=>{dragging=null;clearTimeout(hoverTimer);pageHover=null;$$('.drag-over').forEach(x=>x.classList.remove('drag-over'))});
 load();render();window.parent.postMessage({type:'bg-dim03-ready',seed:{format:'v5',rows:sample.map(make)}},location.origin);
})();
</script>
<datalist id="gradeSuggestions"><option value="强制性"><option value="市级"><option value="省级"><option value="国家级"><option value="行业"></datalist>
</body></html>
