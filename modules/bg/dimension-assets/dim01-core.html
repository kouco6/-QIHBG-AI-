<style>

.rail{display:flex;gap:16px;align-items:center}.rail .circle{width:8px;height:8px;border-radius:50%;background:#458bca;display:inline-block}

.overlay{position:fixed;inset:0;background:rgba(10,29,52,.23);z-index:40;visibility:hidden;opacity:0;transition:opacity .22s,visibility .22s}.overlay.open{visibility:visible;opacity:1}
