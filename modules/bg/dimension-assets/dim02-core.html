function renderOverlay(){const root=document.getElementById('overlay');if(viewer){root.innerHTML=`<div class="viewer" data-act="close-viewer">${viewer?`<img src="${esc(viewer)}" alt="原始图片放大查看">`:''}<button data-act="close-viewer">× 关闭</button></div>`;return}if(!modal){root.innerHTML='';return}let form='',heading='',intro='',confirm='确认';if(modal.type==='edit-large'){heading='编辑唯一大场景名称';form=inputHTML('名称','name',draft.largeName);confirm='保存名称'}if(modal.type==='edit-system'){heading='编辑系统名称';form=inputHTML('名称','name',modal.ref.name);confirm='保存名称'}if(modal.type==='edit-device'||modal.type==='new-device'){heading=modal.type==='new-device'?'新增设备':'编辑设备';let d=modal.ref||{name:'',status:'missing'};form=inputHTML('设备名称','name',d.name)+`<div class="form-row"><label>产品状态</label><select id="modal-status"><option value="planned" ${d.status==='planned'?'selected':''}>本次企划</option><option value="existing" ${d.status==='existing'?'selected':''}>现有覆盖</option><option value="missing" ${d.status==='missing'?'selected':''}>未覆盖</option></select></div>`;confirm='保存设备'}if(modal.type==='new-system'){heading='新增业务系统';form=inputHTML('系统名称','name','');confirm='创建系统'}if(modal.type==='edit-scene'||modal.type==='new-scene'){heading=modal.type==='new-scene'?'新增细分业务场景':'编辑细分业务场景名称';form=inputHTML('场景名称','name',modal.ref?.name||'');intro='名称须与当前大场景下的其他细分业务场景不同；允许保留未命名草稿。';confirm='确认名称'}if(modal.type==='delete'){heading=`删除${modal.kindLabel}？`;intro=`即将删除「${esc(modal.name||'未命名')}」及其内部内容，变更只写入工作草稿，正式预览须保存并应用后才更新。`;confirm='确认删除'}if(modal.type==='reset'){heading='恢复初始演示数据？';intro='此操作会清除当前示例的草稿、正式版本和历史快照，并重新载入演示数据。';confirm='恢复演示'}root.innerHTML=`<div class="mask"><div class="dialog"><h2>${heading}</h2>${intro?`<p>${intro}</p>`:''}${form}<div class="dialog-actions">${makeBtn('取消','close-modal')}${makeBtn(confirm,'confirm-modal',modal.type==='delete'||modal.type==='reset'?'danger':'primary')}</div></div></div>`;if(modal.error){const input=document.getElementById('modal-name');if(input){input.clas function inputHTML(label,id,value){return `<div class="form-row"><label>${label}</label><input id="modal-${id}" value="${esc(value)}" autocomplete="off"></div>`}function openModal(type,info={}){modal={type,...info};renderOverlay();document.getElementById('modal-name')?.focus()}
function doConfirm(){if(!modal)return;let m=modal,v=document.getElementById('modal-name')?.value??'',name=v.trim();if(m.type==='edit-large'){draft.largeName=v;changed()}else if(m.type==='new-system'){draft.systems.push({id:uuid(),name:v,devices:[]});changed()}else if(m.type==='edit-system'){m.ref.name=v;changed()}else if(m.type==='new-device'){m.parent.devices.push({id:uuid(),name:v,status:document.getElementById('modal-status').value,image:''});changed()}else if(m.type==='edit-device'){m.ref.name=v;m.ref.status=document.getElementById('modal-status').value;changed()}else if(m.type==='new-scene'||m.type==='edit-scene'){if(name&&draft.scenes.some(s=>s.id!==m.ref?.id&&s.name.trim().toLowerCase()===name.toLowerCase())){m.error='名称重复：请修改为唯一名称，或点击取消保留原草稿';renderOverlay();return}if(m.type==='new-scene'){const s={id:uuid(),name:v,topology:'',features:[],needs:[],pains:[],goals:[]};draft.scenes.push(s);selected=s.id}else m.ref.name=v;changed()}else if(m.type==='delete'){m.doDelete();changed()}else if(m.type==='reset'){draft=sample();published=clone(draft);history=[];selected=draft.scenes[0]?.id;changeCounter=0;appliedCounter=0;issues=null;saveLocal();render();notify('演示数据已恢复')}modal=null;render()}
function validate(d){let e=[];if(d.enabled?.large===false&&d.enabled?.scenes===false)e.push({section:'章节设置',field:'至少启用一个章节',ref:'macro-scene'});const add=(section,field,ref,sceneId=null)=>e.push({section,field,ref,sceneId});if(d.enabled?.large!==false&&!d.largeImage)add('大场景','大场景主图','macro-scene');if(d.enabled?.scenes!==false&&!d.scenes.length)add('细分业务场景','至少创建一个细分业务场景','business-scene');if(d.enabled?.large!==false&&!d.largeName.trim())add('大场景','大场景名称','macro-scene');if(d.enabled?.large!==false&&!d.systems.length)add('系统设备','至少一个业务系统','macro-scene');(d.enabled?.large!==false?d.systems:[]).forEach((s,i)=>{if(!s.name.trim())add('系统设备',`系统${i+1}名称`,'system-'+s.id);if(!s.devices.length)add('系统设备',`${s.name||'未命名系统'}：至少一款设备`,'system-'+s.id);s.devices.forEach((v,j)=>{if(!v.name.trim())add('系统设备',`${s.name||'未命名系统'}：设备${j+1}名称`,'device-'+v.id)})});const set=new Map();(d.enabled?.scenes!==false?d.scenes:[]).forEach((s,i)=>{if(!s.name.trim())add('细分业务场景',`场景${i+1}名称`,'scene-detail',s.id);const norm=s.name.trim().toLowerCase();if(norm){if(set.has(norm))add('细分业务场景',`场景名称重复：${s.name}`,'scene-detail',s.id);else set.set(norm,s.id)}if(!s.topology)add('细分业务场景',`${s.name||'未命名场景'}：拓扑原图`,'scene-detail',s.id);[['features','场景特点'],['needs','场景需求'],['pains','场景痛点'],['goals','关键功能设计目标']].forEach(([k,label])=>{if(!s[k].length)add('细分业务场景',`${s.name||'未命名场景'}：${label}至少一条`,'scene-detail',s.id);s[k].forEach((v,j)=>{if(k==='goals'){if(!v.text.trim())add('细分业务场景',`${s.name||'未命名场景'}：目标${j+1}未填写`,'scene-detail',s.id)}else{if(!v.name.trim()||!v.description.trim())add('细分业务场景',`${s.name||'未命名场景'}：${label}第${j+1}条关键词/说明缺失`,'scene-detail',s.id)}})})});return e}
function renderIssues(){document.getElementById('issue-layer')?.remove();if(!issues?.length||!work())return;const dock=document.createElement('div');dock.id='issue-layer';dock.className='dock';dock.innerHTML=`<div class="dock-head"><b>待补全 ${issues.length} 项</b>${makeBtn(issueCollapsed?'展开':'收起','toggle-issues','sm')}</div>${issueCollapsed?'':`<div class="dock-list">${issues.map((x,i)=>`<button class="issue" data-act="issue" data-index="${i}"><b>${esc(x.section)}</b> · ${esc(x.field)}</button>`).join('')}</div>`}`;document.body.appendChild(dock)}function goIssue(i){const x=issues?.[i];if(!x)return;mode='work';if(x.sceneId)selected=x.sceneId;render();document.getElementById(x.ref)?.scrollIntoView({behavior:'smooth',block:'center'});notify(`请补全：${x.field}`)}function publish(){issues=validate(draft);issueCollapsed=false;if(issues.length){render();goIssue(0);notify(`未通过完整性校验：仍有 ${issues.length} 项待补全`);return}parent.postMessage({type:'bg-dim02-publish',draft:{...clone(draft),enabled:clone(draft.enabled||{large:true,scenes:true})}},location.origin)}
function applyImage(target,file){if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>450000){notify('请选择小于450 KB的PNG、JPEG、WebP或GIF图片');return}const reader=new FileReader();reader.onload=()=>{if(target.kind==='large')draft.largeImage=reader.result;else if(target.kind==='topology'){const s=draft.scenes.find(x=>x.id===target.id);if(s)s.topology=reader.result}else{const s=draft.systems.find(x=>x.id===target.parent),v=s?.devices.find(x=>x.id===target.id);if(v)v.image=reader.result}changed();notify('图片已写入工作草稿')};reader.readAsDataURL(file)}let imageTarget=null;function upload(kind,id,parent){imageTarget={kind,id,parent};document.getElementById('file-input').value='';document.getElementById('file-input').click()};document.getElementById('file-input').addEventListener('change',e=>applyImage(imageTarget,e.target.files[0]));
function moveWithin(arr,id,step){let i=arr.findIndex(v=>v.id===id);if(i<0)return;let j=i+step;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];changed()}
function handle(act,el){const id=el.dataset.id,parent=el.dataset.parent,d=draft,sys=d.systems.find(x=>x.id===parent),dev=sys?.devices.find(x=>x.id===id),s=d.scenes.find(x=>x.id===id),sel=d.scenes.find(x=>x.id===selected);if(act==='work-mode'){mode='work';render();return}if(act==='preview-mode'){mode='preview';issues=null;render();notify(isDirty()?'预览仅显示已应用版本，工作草稿已保留':'已进入只读预览');return}if(act==='select-scene'){selected=id;render();return}if(act==='close-modal'){modal=null;renderOverlay();return}if(act==='confirm-modal'){doConfirm();return}if(act==='close-viewer'){viewer=null;renderOverlay();return}if(act==='toggle-issues'){issueCollapsed=!issueCollapsed;renderIssues();return}if(act==='issue'){goIssue(+el.dataset.index);return}if(act==='view-large'){viewer=data().largeImage||art();renderOverlay();return}if(act==='view-topology'){viewer=current()?.topology;renderOverlay();return}if(act==='view-device'){const x=data().systems.find(v=>v.id===parent)?.devices.find(v=>v.id===id);if(x?.image){viewer=x.image;renderOverlay()}else notify('当前设备尚未上传真实图片');return}if(!work())return;if(act==='toggle-chapter'){if(!work())return;draft.enabled??={large:true,scenes:true};draft.enabled[el.dataset.chapter]=!draft.enabled[el.dataset.chapter];changed();return}if(act==='save-draft'){saveLocal(true);notify('工作草稿正在保存到本机平台');return}if(act==='publish'){publish();return}if(act==='edit-large'){openModal('edit-large');return}if(act==='edit-system'){openModal('edit-system',{ref:d.systems.find(x=>x.id===id)});return}if(act==='add-system'){openModal('new-system');return}if(act==='delete-system'){let x=d.systems.find(v=>v.id===id);openModal('delete',{kindLabel:'业务系统',name:x?.name,doDelete:()=>d.systems=d.systems.filter(v=>v.id!==id)});return}if(act==='add-device'){openModal('new-device',{parent:sys});return}if(act==='edit-device'){openModal('edit-device',{ref:dev});return}if(act==='delete-device'){openModal('delete',{kindLabel:'设备',name:dev?.name,doDelete:()=>sys.devices=sys.devices.filter(v=>v.id!==id)});return}if(act==='add-scene'){const fresh={id:uuid(),name:'',topology:'',features:[],needs:[],pains:[],goals:[]};d.scenes.push(fresh);selected=fresh.id;changed();openModal('edit-scene',{ref:fresh});return}if(act==='edit-scene'){openModal('edit-scene',{ref:s});return}if(act==='delete-scene'){openModal('delete',{kindLabel:'细分业务场景',name:s?.name,doDelete:()=>{let idx=d.scenes.findIndex(v=>v.id===id);d.scenes.splice(idx,1);selected=d.scenes[idx]?.id||d.scenes[idx-1]?.id||null}});return}if(act==='add-entry'){let k=el.dataset.field;sel[k].push(k==='goals'?{id:uuid(),text:''}:a('',''));changed();return}if(act==='remove-entry'){let k=el.dataset.field;sel[k]=sel[k].filter(x=>x.id!==id);changed();return}if(act==='move-entry'){moveWithin(sel[el.dataset.field],id,+el.dataset.dir);return}if(act==='upload-large'){upload('large');return}if(act==='upload-topology'){upload('topology',selected);return}if(act==='upload-device'){upload('device',id,parent);return}if(act==='reset'){openModal('reset');return}if(act==='export-json'){const blob=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'});download(blob,'DIM02_工作草稿.json');return}if(act==='import-json'){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x.largeName!=='string'||!Array.isArray(x.systems)||!Array.isArray(x.scenes))throw 0;draft=x;selected=x.scenes[0]?.id||null;changed();notify('草稿已导入，正式预览保持不变')}catch{notify('无效的DIM-02草稿JSON')}};r.readAsText(input.files[0])};input.click();return}}
function download(blob,name){let u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;handle(el.dataset.act,el)});document.addEventListener('input',e=>{if(e.target.id==='modal-name'&&modal?.type==='edit-scene'){const v=e.target.value.trim().toLowerCase();modal.error=v&&draft.scenes.some(x=>x.id!==modal.ref.id&&x.name.trim().toLowerCase()===v)?'名称重复：请修改为唯一名称，或点击取消保留原草稿':'';e.target.classList.toggle('bad-field',!!modal.error);let hint=e.target.nextElementSibling;if(hint?.dataset?.role==='duplicate-hint')hint.remove();if(modal.error)e.target.insertAdjacentHTML('afterend',`<small data-role="duplicate-hint" style="color:#c4434e">${esc(modal.error)}</small>`);return}if(!work())return;const t=e.target,k=t.dataset.field,id=t.dataset.id,prop=t.dataset.prop,s=draft.scenes.find(x=>x.id===selected);if(!s)return;let v=s[k]?.find(x=>x.id===id);if(!v)return;v[prop||'text']=t.value;changeCounter++;saveLocal();if(issues){issues=validate(draft);renderIssues()}});document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el||!work())return;dragging={type:el.dataset.drag,id:el.dataset.id||el.id.replace('system-','').replace('device-',''),parent:el.dataset.parent};e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});document.addEventListener('drop',e=>{const target=e.target.closest('[data-drag]');if(!target||!dragging||target.dataset.drag!==dragging.type)return;e.preventDefault();let type=dragging.type,id=target.dataset.id||target.id.replace('system-','').replace('device-','');if(type==='scene'){const arr=draft.scenes;const a=arr.findIndex(v=>v.id===dragging.id),b=arr.findIndex(v=>v.id===id);if(a>=0&&b>=0){arr.splice(b,0,arr.splice(a,1)[0]);changed()}}else if(type==='system'){let arr=draft.systems,a=arr.findIndex(v=>v.id===dragging.id),b=arr.findIndex(v=>v.id===id);if(a>=0&&b>=0){arr.splice(b,0,arr.splice(a,1)[0]);changed()}}else if(type==='device'&&dragging.parent===target.dataset.parent){let arr=draft.systems.find(v=>v.id===dragging.parent)?.devices||[],a=arr.findIndex(v=>v.id===dragging.id),b=arr.findIndex(v=>v.id===id);if(a>=0&&b>=0){arr.splice(b,0,arr.splice(a,1)[0]);changed()}}dragging=null});document.addEventListener('dragend',()=>dragging=null);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(viewer)viewer=null;else if(modal)modal=null;renderOverlay()}});

function legacyToCurrent(old){if(!old||!old.macroTitle)return old;return {largeName:old.macroTitle,largeImage:'',systems:old.systems.map((g,i)=>({id:'legacy-system-'+i,name:g.title,devices:g.devices.map((d,j)=>({id:'legacy-device-'+i+'-'+j,name:d.name,status:d.status==='企划产品'?'planned':d.status==='已有产品'?'existing':'missing',image:''}))})),scenes:old.scenes.map((s,i)=>({id:'legacy-scene-'+i,name:s.name,topology:'',features:(s.characteristics||[]).map((r,j)=>({id:'legacy-feature-'+i+'-'+j,name:r.keyword,description:r.detail})),needs:(s.needs||[]).map((r,j)=>({id:'legacy-need-'+i+'-'+j,name:r.keyword,description:r.detail})),pains:(s.pains||[]).map((r,j)=>({id:'legacy-pain-'+i+'-'+j,name:r.keyword,description:r.detail})),goals:(s.goals||[]).map((g,j)=>({id:'legacy-goal-'+i+'-'+j,text:g.name+'：'+g.description}))}))}}
function paintText(){const d=published;let html='<article class="text-output"><h1>行业应用场景</h1>';if(d.enabled?.large!==false)html+='<h2>大场景：'+esc(d.largeName)+'</h2><h3>业务系统与设备</h3>'+d.systems.map(s=>'<h4>'+esc(s.name)+'</h4><p>'+s.devices.map(v=>esc(v.name)+'（'+({planned:'本次企划',existing:'现有覆盖',missing:'未覆盖'}[v.status]||'待核实')+'）').join('、')+'</p>').join('');if(d.enabled?.scenes!==false)html+='<h2>细分业务场景</h2>'+d.scenes.map(s=>'<h3>'+esc(s.name||'未命名场景')+'</h3>'+[['features','场景特点'],['needs','场景需求'],['pains','场景痛点']].map(([k,label])=>'<h4>'+label+'</h4>'+s[k].map(v=>'<p>'+esc(v.name)+'：'+esc(v.description)+'</p>').join('')).join('')+'<h4>关键功能设计目标</h4>'+s.goals.map(v=>'<p>'+esc(v.text)+'</p>').join('')).join('');document.getElementById('app').innerHTML=html+'</article>';document.getElementById('overlay').innerHTML=''}
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const m=event.data;if(m?.type==='bg-dim02-state'){published=clone(legacyToCurrent(m.content||initial));draft=clone(m.draft||published);mode=m.workMode?'work':'preview';selected=(mode==='work'?draft:published).scenes[0]?.id||null;issues=null;render()}if(m?.type==='bg-dim02-command'){if(m.action==='publish')publish();if(m.action==='save-draft')saveLocal(true)}if(m?.type==='bg-dim02-published'){published=clone(m.content);draft=clone(m.draft||m.content);mode='preview';issues=null;render();notify('已保存并应用到本机平台')}if(m?.type==='bg-dim02-save-error')notify(m.error||'本机保存失败，请重试');if(m?.type==='bg-dim02-section')document.getElementById(m.id)?.scrollIntoView({block:'start',behavior:'smooth'})});
render();parent.postMessage({type:'bg-dim02-ready',seed:clone(initial)},location.origin);
</script></body></html>
