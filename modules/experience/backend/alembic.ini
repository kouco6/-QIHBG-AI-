# Alembic configuration (UEI Experience Workbench backend)
# NOTE: keep this file ASCII-only; configparser reads it with the system locale codec on Windows.
[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os
# Actual URL is injected by app/migrations/env.py from app settings; this is a placeholder only.
sqlalchemy.url = sqlite:///./data/uei.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
